function deltaInfo(cur, prev){
  if (!(prev > 0)) return { txt: cur > 0 ? 'nuevo este mes' : 'sin datos el mes pasado', cls:'' };
  const pct = Math.round((cur-prev)/prev*100);
  return { txt:`${pct>=0?'+':''}${pct}% vs mes pasado`, cls: pct >= 8 ? 'good' : pct <= -15 ? 'bad' : '' };
}

function renderPlan(){
  const pm = S.planMonth;
  const weeksThisMonth = PLAN.map((w,i) => ({ w, i }))
    .filter(({w}) => w.start.getFullYear() === pm.getFullYear() && w.start.getMonth() === pm.getMonth());
  const cwi = currentWeekIndex();
  const ftp = S.profile.ftp;
  const isCurMonth = pm.getFullYear() === today.getFullYear() && pm.getMonth() === today.getMonth();

  const selIdx = weeksThisMonth.some(x => x.i === S.selectedWeek) ? S.selectedWeek
    : (isCurMonth && weeksThisMonth.some(x => x.i === cwi)) ? cwi
    : (weeksThisMonth[0] ? weeksThisMonth[0].i : null);
  const w = selIdx !== null ? PLAN[selIdx] : null;

  const mp = monthlyProgress(pm);
  const km = deltaInfo(mp.cur.km, mp.prev.km);
  const tss = deltaInfo(mp.cur.tss, mp.prev.tss);
  const rec = monthlyRecommendation(mp);

  const monthHeader = `
    <div class="cal-head">
      <button class="cal-nav" data-plan-month="-1" aria-label="Mes anterior">${icon('left',17)}</button>
      <div class="cal-month">${MONTHS_ES[pm.getMonth()]} ${pm.getFullYear()}</div>
      <button class="cal-nav" data-plan-month="1" aria-label="Mes siguiente">${icon('right',17)}</button>
    </div>`;

  const progressCard = `
    <div class="card">
      ${monthHeader}
      <div class="tiny" style="margin-top:2px;text-align:center">
        ${mp.isCurrent ? `Llevas ${mp.daysElapsed} de ${mp.daysInMonth} días` : 'Mes completo'} · comparado con ${mp.prevLabel}
      </div>
      <div class="grid3" style="margin-top:12px">
        ${metricBox('Kilómetros', mp.cur.km, 'km', km.txt, km.cls)}
        ${metricBox('Carga', mp.cur.tss, 'TSS', tss.txt, tss.cls)}
        ${metricBox('Salidas', mp.cur.count, '', `${mp.prev.count} el mes pasado`, '')}
      </div>
      ${(mp.ctlDelta !== null || mp.ftpDelta) ? `
      <div class="grid2" style="margin-top:10px">
        ${mp.ctlDelta !== null ? metricBox('Fondo (CTL)', (mp.ctlDelta>0?'+':'')+mp.ctlDelta, 'pts', 'en el mes', mp.ctlDelta>=3?'good':mp.ctlDelta<=-3?'bad':'') : ''}
        ${mp.ftpDelta ? metricBox('FTP', (mp.ftpDelta>0?'+':'')+mp.ftpDelta, 'W', 'en el mes', mp.ftpDelta>0?'good':mp.ftpDelta<0?'bad':'') : ''}
      </div>` : ''}
      <div class="rule"></div>
      <div class="muted">${rec}</div>
    </div>`;

  if (!weeksThisMonth.length){
    return `
      <div class="px sec">
        <div class="eyebrow">Tu progreso</div>
        <div class="h2">Seguimiento mes a mes</div>
        <div style="margin-top:14px">${progressCard}</div>
        <div class="empty" style="margin-top:14px">
          <div class="t">Sin semanas de plan en ${MONTHS_ES[pm.getMonth()]}</div>
          <div class="d">El plan solo mantiene generados los meses cercanos a hoy.</div>
          <button class="btn" style="margin-top:12px;width:auto;padding:10px 18px" data-plan-today="1">Ir al mes actual</button>
        </div>
      </div>`;
  }

  const chips = weeksThisMonth.map(({w:week,i}, idx) => `
    <button class="chip ${i===selIdx?'active':''} ${i===cwi?'now':''}" data-week="${i}">
      <span class="s">Sem</span>
      <span class="n num">${idx+1}</span>
      <span class="ph">${week.recovery ? 'descarga' : week.phase}</span>
    </button>`).join('');

  const cards = w.sessions.map(s => {
    const key = `${w.week}-${s.idx}`;
    const done = !!S.sessionsDone[key];
    const z = ZONES[Math.max(0, s.zone-1)];
    const zc = s.zone === 0 ? 'var(--txt-3)' : z.hex;
    const dayName = s.dateObj.toLocaleDateString('es-MX',{ weekday:'long' });
    return `
      <button class="ses ${done?'done':''}" style="--zc:${zc}" data-session="${key}">
        <div class="r1">
          <span class="tag">${s.zone ? `Z${s.zone} · ${z.name}` : 'Descanso'}</span>
          <span class="tick ${done?'on':''}"></span>
        </div>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="desc">${SESSIONS[s.key].desc(ftp)}</div>
        <div class="foot">
          <span><b>${dayName.charAt(0).toUpperCase()+dayName.slice(1)}</b> ${fmtShort(s.dateObj)}</span>
          ${s.minutes ? `<span><b>${s.minutes}</b> min</span>` : ''}
          ${s.tss ? `<span><b>${s.tss}</b> TSS</span>` : ''}
          <span style="color:${done?'var(--brand)':'var(--txt-3)'}">${done ? 'Hecha' : 'Toca para marcar'}</span>
        </div>
      </button>`;
  }).join('');

  const real = weekStats(w.start, w.end);

  return `
    <div class="sec">
      <div class="px">
        <div class="eyebrow">Tu progreso</div>
        <div class="h2">${S.objective.name ? escapeHtml(S.objective.name) : 'Mejora continua'}</div>
        <div class="tiny" style="margin-top:5px">Cada sesión trae los vatios calculados con tu FTP${ftp ? ` (${ftp} W)` : ''}. La fase se ajusta sola con tu fondo (CTL) real, sin fecha límite.</div>
        <div style="margin-top:14px">${progressCard}</div>
      </div>

      <div class="chips" style="margin-top:14px">${chips}</div>

      <div class="px" style="margin-top:14px">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div class="eyebrow b">${escapeHtml(w.phase)}${w.recovery ? ' · semana de descarga' : ''}</div>
              <div class="h2">${fmtShort(w.start)} – ${fmtShort(w.end)}</div>
            </div>
            <div style="text-align:right">
              <div class="num" style="font-size:22px;color:var(--brand)">${w.targetTss}</div>
              <div class="tiny">TSS objetivo</div>
            </div>
          </div>
          <div class="zrule">${ZONES.map(z=>`<i style="background:${z.hex}"></i>`).join('')}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--txt-2)">
            <span>Real: <b class="num" style="color:${real.tss>=w.targetTss?'var(--ok)':'var(--brand)'};font-size:14px">${real.tss}</b> TSS</span>
            <span>${real.km} km · ${secToDur(real.sec)}</span>
          </div>
          <div class="tiny" style="margin-top:10px">${w.recovery ? 'Semana de descarga: baja el volumen a propósito para que el cuerpo asimile las 3 anteriores. No la conviertas en una semana normal.' : (PHASE_NOTE[w.phase] || '')}</div>
        </div>

        <div style="margin-top:14px">${cards}</div>

        ${!ftp ? `<div class="empty" style="margin-top:6px"><div class="t">Pon tu FTP para ver vatios</div><div class="d">Sin FTP las sesiones se describen por sensación. Con FTP, cada intervalo trae su rango exacto en watts.</div><button class="btn" style="margin-top:12px" data-open-profile="1">Configurar FTP</button></div>` : ''}
      </div>
    </div>`;
}

/* ============================================================
   VISTA: FORMA (análisis)
============================================================ */
function renderForm(){
  const rides = loadRides();
  if (!rides.length){
    return `
      <div class="px sec">
        <div class="eyebrow">Análisis</div>
        <div class="h2">Todavía no hay nada que medir</div>
        <div class="empty" style="margin-top:14px">
          <div class="t">Conecta Strava</div>
          <div class="d">En cuanto entren tus salidas, aquí aparecen tu curva de potencia, tu carga, tu forma y las lecturas de cada dato.</div>
        </div>
      </div>`;
  }

  const pmc = computePMC();
  const ftp = S.profile.ftp;
  const kg = S.profile.weightKg;
  const curve = powerCurve();
  const curveKeys = Object.keys(curve).map(Number).sort((a,b)=>a-b);
  const est = estimateFtp();
  const cp = est ? est.cp : null;
  const vo2 = vo2maxEstimate();
  const pol = polarization();
  const zt = zoneTotals(56);
  const ef = efSeries();
  const dec = decouplingSeries();
  const insights = buildInsights();

  if (pmc) setTimeout(() => drawPMC(pmc.series), 0);
  if (curveKeys.length >= 4) setTimeout(() => drawPowerCurve(curve), 0);
  if (ef.length >= 3) setTimeout(() => drawLine('efCanvas', ef.map(d=>({date:d.date,v:d.ef})), '#00E1C4', { decimals:2, refFirst:true }), 0);
  if (S.ftpHistory.length >= 2) setTimeout(() => drawLine('ftpCanvas', S.ftpHistory.map(d=>({date:d.date,v:d.ftp})), '#F0883B', { decimals:0, step:true }), 0);

  const keyDurs = [5,60,300,1200,3600];

  return `
    <div class="px sec">
      <div class="eyebrow">Análisis</div>
      <div class="h2">Cómo vas realmente</div>
      <div class="tiny" style="margin-top:5px">${rides.length} salidas · carga calculada con ${loadQuality()}</div>

      ${pmc ? `
      <div class="card" style="margin-top:16px">
        <div class="eyebrow b">Fondo, fatiga y frescura</div>
        <div class="chart" style="margin-top:10px;border:none;padding:0;background:none"><canvas id="pmcCanvas"></canvas></div>
        <div class="chart-legend">
          <span><i style="background:#00E1C4"></i>Fondo (CTL)</span>
          <span><i style="background:#FF5C6E"></i>Fatiga (ATL)</span>
          <span><i style="background:#8AB4F8"></i>Frescura (TSB)</span>
        </div>
        <div class="grid3" style="margin-top:12px">
          ${metricBox('Fondo', Math.round(pmc.ctl), '', '', 'brandc')}
          ${metricBox('Fatiga', Math.round(pmc.atl), '', '', '')}
          ${metricBox('Frescura', (pmc.tsb>0?'+':'')+Math.round(pmc.tsb), '', '', pmc.tsb < -30 ? 'bad' : pmc.tsb > 5 ? 'good' : '')}
        </div>
        <div class="muted" style="margin-top:12px">
          Tu fondo sube o baja ${pmc.rampRate > 0 ? '+' : ''}${pmc.rampRate} puntos por semana.
          ${pmc.rampRate > 8 ? 'Arriba de 8 es zona de riesgo: es el ritmo con el que la gente se lesiona o se enferma.'
            : pmc.rampRate >= 3 ? 'Entre 3 y 6 por semana es el rango en el que se gana fondo de forma sostenible.'
            : pmc.rampRate >= 0 ? 'Estás sosteniendo lo que tienes. Para progresar necesitas subir un poco el volumen.'
            : 'Estás perdiendo fondo. Si no es descarga planeada, retoma volumen suave.'}
        </div>
      </div>` : ''}

      <div class="card" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="eyebrow b">Tu umbral (FTP)</div>
          <button class="link" data-open-profile="1">Editar</button>
        </div>
        <div class="grid2" style="margin-top:12px">
          ${metricBox('FTP actual', ftp || '—', ftp?'W':'', S.profile.ftpSource ? `Fuente: ${escapeHtml(S.profile.ftpSource)}` : '', 'brandc')}
          ${metricBox('Relación peso', (ftp&&kg)?(ftp/kg).toFixed(2):'—', (ftp&&kg)?'W/kg':'', (ftp&&kg)?wkgLevel(ftp/kg):`${kg} kg`, '')}
          ${cp ? metricBox('Potencia crítica', cp.cp, 'W', `W′ ${(cp.wPrime/1000).toFixed(1)} kJ`, '') : ''}
          ${vo2 ? metricBox('VO₂ máx estimado', vo2, 'ml/kg/min', 'De tus mejores 5 min', '') : ''}
        </div>
        ${vo2 ? `<div class="tiny" style="margin-top:8px">Es el número menos confiable de esta pantalla: la fórmula (ACSM) suele quedarse corta con ciclistas ya entrenados, y aquí además sustituye la prueba de laboratorio en la que se validó por tu mejor esfuerzo de 5 min en ruta. Tómalo como referencia de tendencia, no como valor exacto.</div>` : ''}

        ${est ? `
        <div class="rule"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:700">Estimación con tus datos: ${est.ftp} W</div>
            <div class="tiny" style="margin-top:3px">De ${est.why}${est.date ? ` · ${fmtShort(parseDate(est.date))}` : ''}</div>
          </div>
          ${(!ftp || Math.abs(est.ftp - ftp) >= 5)
            ? `<button class="btn" style="width:auto;padding:9px 14px;flex-shrink:0" data-use-ftp="${est.ftp}">Usar</button>` : ''}
        </div>
        <div class="tiny" style="margin-top:8px">Una estimación no sustituye una prueba. Lo más fiable sigue siendo 20 min a tope, bien calentado, y multiplicar por 0.95.</div>
        ` : `<div class="tiny" style="margin-top:12px">Cuando tengas salidas con potenciómetro y un esfuerzo largo a tope, aquí aparecerá una estimación de FTP calculada con tus datos.</div>`}

        ${S.ftpHistory.length >= 2 ? `
        <div class="rule"></div>
        <div class="eyebrow" style="margin-bottom:8px">Cómo ha cambiado</div>
        <div class="chart" style="height:130px"><canvas id="ftpCanvas"></canvas></div>` : ''}
      </div>

      ${curveKeys.length >= 3 ? `
      <div class="card" style="margin-top:12px">
        <div class="eyebrow b">Curva de potencia</div>
        <div class="tiny" style="margin-top:4px">Tu mejor potencia media sostenida para cada duración, sacada de los datos segundo a segundo de tus salidas.</div>
        <div class="chart" style="margin-top:10px"><canvas id="curveCanvas"></canvas></div>
        <div style="margin-top:12px">
          ${keyDurs.filter(d=>curve[d]).map(d => `
            <div class="row">
              <div class="l">${durLabel(d)}<small>${curve[d].date ? fmtShort(parseDate(curve[d].date)) : ''} · ${escapeHtml((curve[d].name||'').slice(0,28))}</small></div>
              <div class="r"><b>${curve[d].w} W</b><small>${kg ? (curve[d].w/kg).toFixed(2)+' W/kg' : ''}</small></div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${zt ? `
      <div class="card" style="margin-top:12px">
        <div class="eyebrow b">Dónde pasas el tiempo</div>
        <div class="tiny" style="margin-top:4px">Últimas 8 semanas, ${secToDur(zt.sum)} con potencia registrada.</div>
        <div class="zbar" style="margin-top:12px">
          ${ZONES.map(z => { const p = zt.tot[z.key]/zt.sum*100; return p>0 ? `<i style="width:${p}%;background:${z.hex}" title="${z.name}"></i>` : ''; }).join('')}
        </div>
        <div class="zlist">
          ${ZONES.map(z => {
            const sec = zt.tot[z.key], p = Math.round(sec/zt.sum*100);
            return `<div class="zrow">
              <span class="zdot" style="background:${z.hex}"></span>
              <span class="nm">Z${z.n} ${z.name}</span>
              <span class="rg">${zoneWatts(z, ftp)}</span>
              <span class="pc" style="color:${z.hex}">${p}%</span>
            </div>`;
          }).join('')}
        </div>
        ${pol ? `<div class="muted" style="margin-top:12px">
          ${pol.lowPct}% fácil · ${pol.midPct}% tempo · ${pol.highPct}% fuerte.
          El reparto que mejor funciona en la mayoría de los estudios es cerca de 80% fácil y 20% fuerte, con muy poco tiempo en medio.
        </div>` : ''}
      </div>` : ''}

      ${ef.length >= 3 ? `
      <div class="card" style="margin-top:12px">
        <div class="eyebrow b">Eficiencia aeróbica</div>
        <div class="tiny" style="margin-top:4px">Vatios por cada latido. Si la línea sube, produces más potencia con el mismo esfuerzo del corazón: eso es mejora aeróbica real.</div>
        <div class="chart" style="margin-top:10px;height:150px"><canvas id="efCanvas"></canvas></div>
        ${(() => {
          const a = ef[0].ef, b = ef[ef.length-1].ef;
          const pct = ((b-a)/a*100).toFixed(1);
          return `<div class="muted" style="margin-top:10px">Vas ${pct>0?'+':''}${pct}% desde tu primera salida comparable. Solo se cuentan rodajes por debajo del 90% del FTP: los días de series distorsionan la medida.</div>`;
        })()}
      </div>` : ''}

      ${dec.length ? `
      <div class="card" style="margin-top:12px">
        <div class="eyebrow b">Aguante en salidas largas</div>
        <div class="tiny" style="margin-top:4px">Cuánto se te cae la relación potencia/pulso en la segunda mitad. Por debajo de 5% es señal de buena base.</div>
        <div style="margin-top:10px">
          ${dec.slice(-5).reverse().map(d => `
            <div class="row">
              <div class="l">${escapeHtml(d.name.slice(0,30))}<small>${fmtShort(parseDate(d.date))}</small></div>
              <div class="r"><b style="color:${d.value>8?'var(--risk)':d.value>5?'var(--warn)':'var(--ok)'}">${d.value}%</b></div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${renderRecords(curve, kg)}

      ${insights.length ? `
      <div class="sec">
        <div class="eyebrow">Todas las lecturas</div>
        <div style="margin-top:10px">${insights.map(insightCard).join('')}</div>
      </div>` : ''}

      <div class="tiny" style="margin:20px 0 24px;line-height:1.7">
        Los modelos usados son los estándar del ciclismo por potencia: TSS, CTL, ATL y TSB de Coggan y Allen (constantes de 42 y 7 días);
        siete zonas de potencia de Coggan; potencia crítica de Monod y Scherrer (regresión sobre esfuerzos de 3 a 20 min);
        consumo de oxígeno estimado con la ecuación de ejercicio en cicloergómetro de la ACSM.
        Son las más confiables cuando hay potenciómetro: TSS, CTL/ATL/TSB, zonas y potencia crítica calculan directamente sobre tus datos.
        La estimación de FTP por umbrales de esfuerzo y la relación W/kg contra tablas de referencia son aproximaciones razonables pero con
        más margen de error. El VO₂ máx es el menos confiable de todos: la fórmula ACSM está pensada para población general de laboratorio,
        no para ciclistas entrenados, y aquí se aplica sobre un esfuerzo de ruta en vez de una prueba controlada. Ninguna sustituye la
        valoración de un entrenador o un médico.
      </div>
    </div>`;
}

function renderRecords(curve, kg){
  const rides = ridesArray();
  if (!rides.length) return '';
  const longest = rides.reduce((m,a) => (!m || a.distanceKm > m.distanceKm) ? a : m, null);
  const climb = rides.reduce((m,a) => (!m || (a.elevationGain||0) > (m.elevationGain||0)) ? a : m, null);
  const hardest = rides.reduce((m,a) => (!m || tssFor(a).tss > tssFor(m).tss) ? a : m, null);
  const fastest = rides.filter(a=>a.distanceKm>=20).reduce((m,a) => (!m || a.avgSpeed > m.avgSpeed) ? a : m, null);
  return `
    <div class="card" style="margin-top:12px">
      <div class="eyebrow b">Tus máximos</div>
      <div style="margin-top:8px">
        ${longest ? `<div class="row"><div class="l">Salida más larga<small>${fmtShort(parseDate(longest.date))}</small></div><div class="r"><b>${longest.distanceKm} km</b><small>${secToDur(longest.movingTimeSec)}</small></div></div>` : ''}
        ${climb && climb.elevationGain ? `<div class="row"><div class="l">Más desnivel<small>${fmtShort(parseDate(climb.date))}</small></div><div class="r"><b>${Math.round(climb.elevationGain)} m</b><small>${climb.distanceKm} km</small></div></div>` : ''}
        ${fastest ? `<div class="row"><div class="l">Media más alta<small>${fmtShort(parseDate(fastest.date))} · ${fastest.distanceKm} km</small></div><div class="r"><b>${(fastest.avgSpeed*3.6).toFixed(1)} km/h</b></div></div>` : ''}
        ${hardest ? `<div class="row"><div class="l">Día más duro<small>${fmtShort(parseDate(hardest.date))}</small></div><div class="r"><b>${Math.round(tssFor(hardest).tss)} TSS</b></div></div>` : ''}
        ${curve[5] ? `<div class="row"><div class="l">Sprint (5 s)<small>${curve[5].date?fmtShort(parseDate(curve[5].date)):''}</small></div><div class="r"><b>${curve[5].w} W</b><small>${kg?(curve[5].w/kg).toFixed(1)+' W/kg':''}</small></div></div>` : ''}
      </div>
    </div>`;
}

/* ============================================================
   VISTA: SALIDAS (calendario)
============================================================ */
function renderRides(){
  const year = S.calendarView.getFullYear(), month = S.calendarView.getMonth();
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const kmByDay = {};
  ridesArray().forEach(a => { kmByDay[a.date] = (kmByDay[a.date] || 0) + a.distanceKm; });

  const planDays = {};
  PLAN.forEach(w => w.sessions.forEach(s => { if (s.key !== 'descanso') planDays[s.date] = true; }));

  let cells = '';
  for (let i=0;i<offset;i++) cells += '<div></div>';
  for (let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const ds = fmt(dt);
    const km = kmByDay[ds];
    const isToday = ds === fmt(today);
    cells += `
      <button class="cal-day ${km?'ride':''} ${isToday?'today':''}" data-day="${ds}" aria-label="${d}">
        <span>${d}</span>
        ${km ? `<span class="kms">${Math.round(km)}</span>` : ''}
        ${!km && planDays[ds] ? '<span class="dot"></span>' : ''}
      </button>`;
  }

  const monthActs = ridesArray()
    .filter(a => { const dt = parseDate(a.date); return dt.getFullYear()===year && dt.getMonth()===month; })
    .sort((a,b) => b.date.localeCompare(a.date));

  const tKm = +monthActs.reduce((t,a)=>t+a.distanceKm,0).toFixed(1);
  const tSec = monthActs.reduce((t,a)=>t+a.movingTimeSec,0);
  const tElev = Math.round(monthActs.reduce((t,a)=>t+(a.elevationGain||0),0));
  const tTss = Math.round(monthActs.reduce((t,a)=>t+tssFor(a).tss,0));

  return `
    <div class="px sec">
      <div class="eyebrow">Salidas</div>
      <div class="h2">Tu mes en la bici</div>

      <div class="card" style="margin-top:14px">
        <div class="cal-head">
          <button class="cal-nav" data-cal="-1" aria-label="Mes anterior">${icon('left',17)}</button>
          <div class="cal-month">${MONTHS_ES[month]} ${year}</div>
          <button class="cal-nav" data-cal="1" aria-label="Mes siguiente">${icon('right',17)}</button>
        </div>
        <div class="cal-grid" style="margin-bottom:4px">${DOW_ES.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
        <div class="legend">
          <div><span class="sq"></span>Salida (km)</div>
          <div><span class="dt"></span>Sesión del plan</div>
        </div>
      </div>

      <div class="grid2" style="margin-top:12px">
        ${metricBox('Kilómetros', tKm, 'km', `${monthActs.length} salidas`, 'brandc')}
        ${metricBox('Tiempo', secToDur(tSec), '', '', '')}
        ${metricBox('Desnivel', tElev, 'm', tKm>0?`${Math.round(tElev/tKm)} m/km`:'', '')}
        ${metricBox('Carga', tTss, 'TSS', '', '')}
      </div>

      ${monthActs.length ? `
      <div class="sec">
        <div class="eyebrow">Detalle</div>
        <div style="margin-top:10px">${monthActs.map(rideRow).join('')}</div>
      </div>` : `
      <div class="empty" style="margin-top:14px">
        <div class="t">Sin salidas este mes</div>
        <div class="d">Cuando sincronices Strava aparecerán aquí con su distancia, potencia y carga.</div>
      </div>`}
      <div style="height:20px"></div>
    </div>`;
}

/* ============================================================
   GRÁFICAS
============================================================ */
function setupCanvas(id){
  const c = document.getElementById(id);
  if (!c) return null;
  const rect = c.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return null;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(rect.width * dpr);
  c.height = Math.round(rect.height * dpr);
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.font = '10px Inter, system-ui, sans-serif';
  return { ctx, w:rect.width, h:rect.height };
}

function drawPMC(series){
  const c = setupCanvas('pmcCanvas');
  if (!c || !series.length) return;
  const { ctx, w, h } = c;
  const pad = { t:12, r:34, b:20, l:30 };

  // Adelgaza la serie si hay mucho historial, para que la línea no se sature
  const stepN = Math.max(1, Math.ceil(series.length / 260));
  const data = series.filter((_, i) => i % stepN === 0 || i === series.length-1);

  const maxL = Math.max(10, ...data.map(d => Math.max(d.ctl, d.atl))) * 1.12;
  const tsbVals = data.map(d => d.tsb);
  const minR = Math.min(-10, ...tsbVals) - 4;
  const maxR = Math.max(10, ...tsbVals) + 4;

  const X = i => pad.l + (i/(data.length-1 || 1)) * (w - pad.l - pad.r);
  const YL = v => h - pad.b - (v/maxL) * (h - pad.t - pad.b);
  const YR = v => h - pad.b - ((v-minR)/(maxR-minR)) * (h - pad.t - pad.b);

  // línea de frescura = 0
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.setLineDash([3,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, YR(0)); ctx.lineTo(w-pad.r, YR(0)); ctx.stroke();
  ctx.setLineDash([]);

  const path = (vals, yFn, color, width, fill) => {
    ctx.beginPath();
    vals.forEach((v,i) => { const x = X(i), y = yFn(v); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    if (fill){
      ctx.save();
      ctx.lineTo(X(vals.length-1), h-pad.b); ctx.lineTo(X(0), h-pad.b); ctx.closePath();
      const g = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
      g.addColorStop(0, fill); g.addColorStop(1, 'rgba(0,225,196,0)');
      ctx.fillStyle = g; ctx.fill(); ctx.restore();
      ctx.beginPath();
      vals.forEach((v,i) => { const x = X(i), y = yFn(v); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    }
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke();
  };

  path(data.map(d=>d.ctl), YL, '#00E1C4', 2.4, 'rgba(0,225,196,.20)');
  path(data.map(d=>d.atl), YL, '#FF5C6E', 1.6);
  path(data.map(d=>d.tsb), YR, '#8AB4F8', 1.4);

  ctx.fillStyle = 'rgba(233,241,245,.40)';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(maxL), pad.l-5, pad.t+8);
  ctx.fillText('0', pad.l-5, h-pad.b);
  ctx.textAlign = 'left';
  ctx.fillText((maxR>0?'+':'')+Math.round(maxR), w-pad.r+4, pad.t+8);
  ctx.fillText(Math.round(minR), w-pad.r+4, h-pad.b);

  ctx.textAlign = 'center';
  ctx.fillText(fmtShort(parseDate(data[0].date)), X(0)+12, h-5);
  ctx.fillText(fmtShort(parseDate(data[data.length-1].date)), X(data.length-1)-14, h-5);
}

function drawPowerCurve(curve){
  const c = setupCanvas('curveCanvas');
  if (!c) return;
  const { ctx, w, h } = c;
  const pad = { t:14, r:12, b:22, l:36 };
  const durs = Object.keys(curve).map(Number).sort((a,b)=>a-b);
  if (durs.length < 2) return;

  const lx = d => Math.log(d);
  const minX = lx(durs[0]), maxX = lx(durs[durs.length-1]);
  const maxY = Math.max(...durs.map(d => curve[d].w)) * 1.08;
  const minY = 0;

  const X = d => pad.l + ((lx(d)-minX)/(maxX-minX || 1)) * (w-pad.l-pad.r);
  const Y = v => h - pad.b - ((v-minY)/(maxY-minY)) * (h-pad.t-pad.b);

  // referencia del FTP
  const ftp = S.profile.ftp;
  if (ftp && ftp < maxY){
    ctx.strokeStyle = 'rgba(240,136,59,.55)';
    ctx.setLineDash([4,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(ftp)); ctx.lineTo(w-pad.r, Y(ftp)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(240,136,59,.85)'; ctx.textAlign = 'left';
    ctx.fillText('FTP', pad.l+3, Y(ftp)-4);
  }

  ctx.beginPath();
  durs.forEach((d,i) => { const x = X(d), y = Y(curve[d].w); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.lineTo(X(durs[durs.length-1]), h-pad.b); ctx.lineTo(X(durs[0]), h-pad.b); ctx.closePath();
  const g = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
  g.addColorStop(0,'rgba(0,225,196,.28)'); g.addColorStop(1,'rgba(0,225,196,0)');
  ctx.fillStyle = g; ctx.fill();

  ctx.beginPath();
  durs.forEach((d,i) => { const x = X(d), y = Y(curve[d].w); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.strokeStyle = '#00E1C4'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.stroke();

  durs.forEach(d => {
    ctx.fillStyle = '#00E1C4';
    ctx.beginPath(); ctx.arc(X(d), Y(curve[d].w), 2.6, 0, Math.PI*2); ctx.fill();
  });

  ctx.fillStyle = 'rgba(233,241,245,.40)';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(maxY)+' W', pad.l-5, pad.t+8);
  ctx.fillText('0', pad.l-5, h-pad.b);

  ctx.textAlign = 'center';
  [5,60,300,1200,3600].forEach(d => {
    if (d < durs[0] || d > durs[durs.length-1]) return;
    ctx.fillText(durLabel(d).replace(' min','m').replace('3600','1h'), X(d), h-5);
  });
}

/* Gráfica de línea genérica: peso, eficiencia aeróbica, historial de FTP */
function drawLine(canvasId, data, color, opts){
  opts = opts || {};
  const c = setupCanvas(canvasId);
  if (!c || data.length < 2) return;
  const { ctx, w, h } = c;
  const pad = { t:12, r:12, b:20, l:38 };

  const vals = data.map(d => d.v);
  const ref = opts.refValue !== undefined ? opts.refValue : (opts.refFirst ? vals[0] : null);
  const all = ref !== null ? vals.concat([ref]) : vals;
  const span = Math.max(...all) - Math.min(...all);
  const padY = span > 0 ? span*0.15 : Math.max(1, Math.abs(all[0])*0.05);
  const min = Math.min(...all) - padY, max = Math.max(...all) + padY;

  const X = i => pad.l + (i/(data.length-1)) * (w-pad.l-pad.r);
  const Y = v => h - pad.b - ((v-min)/(max-min || 1)) * (h-pad.t-pad.b);

  if (ref !== null){
    ctx.strokeStyle = 'rgba(255,255,255,.16)';
    ctx.setLineDash([4,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(ref)); ctx.lineTo(w-pad.r, Y(ref)); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath();
  data.forEach((d,i) => {
    const x = X(i), y = Y(d.v);
    if (!i) ctx.moveTo(x,y);
    else if (opts.step){ ctx.lineTo(x, Y(data[i-1].v)); ctx.lineTo(x,y); }
    else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.stroke();

  data.forEach((d,i) => {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(X(i), Y(d.v), 2.8, 0, Math.PI*2); ctx.fill();
  });

  const dec = opts.decimals !== undefined ? opts.decimals : 1;
  ctx.fillStyle = 'rgba(233,241,245,.40)';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(dec), pad.l-5, pad.t+8);
  ctx.fillText(min.toFixed(dec), pad.l-5, h-pad.b);

  ctx.textAlign = 'center';
  ctx.fillText(fmtShort(parseDate(data[0].date)), X(0)+14, h-5);
  ctx.fillText(fmtShort(parseDate(data[data.length-1].date)), X(data.length-1)-14, h-5);
}

  S.profile.sex = val('inSex');

}

function intensityLabel(i){
  if (i < 0.55) return 'Recuperación';
  if (i < 0.75) return 'Fondo';
  if (i < 0.85) return 'Tempo';
  if (i < 0.95) return 'Fuerte';
  if (i < 1.05) return 'De competencia';
  return 'Muy por encima del umbral';
}

function applyRestored(p){
  if (!p || typeof p !== 'object') throw new Error('formato');
  if (p.profile)    S.profile   = { ...S.profile, ...p.profile };
  if (p.objective)  S.objective = { ...S.objective, ...p.objective };
  if (p.planCfg)    S.planCfg   = { ...S.planCfg, ...p.planCfg };
  if (Array.isArray(p.ftpHistory)) S.ftpHistory = p.ftpHistory;
  if (Array.isArray(p.rideDays))   S.rideDays = p.rideDays;
  if (Array.isArray(p.components) && p.components.length) S.components = p.components;
  if (Array.isArray(p.events))     S.events = p.events;
  if (p.sessionsDone && typeof p.sessionsDone === 'object') S.sessionsDone = p.sessionsDone;
  if (p.activities && typeof p.activities === 'object')     S.activities = p.activities;
  if (p.analysis && typeof p.analysis === 'object')         S.analysis = p.analysis;
  rebuildPlan();
}

/* ============================================================
   GOOGLE DRIVE
   Necesita un Client ID de OAuth (tipo "Aplicación web") con la
   Google Drive API activada y este dominio autorizado.
============================================================ */
const GOOGLE_CLIENT_ID = '427984660518-7qtn0q5h462uuh59gbd48ar70uomennn.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE = 'cyclist-backup.json';
let gTokenClient = null, gAccessToken = null, gTokenExpiresAt = 0;

function gdriveConfigured(){ return !!GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('TU_'); }

function gdriveGetToken(){
  return new Promise((resolve, reject) => {
    if (gAccessToken && Date.now() < gTokenExpiresAt - 60000){ resolve(gAccessToken); return; }
    if (!window.google || !google.accounts || !google.accounts.oauth2){
      reject(new Error('No cargó el inicio de sesión de Google. Revisa tu conexión.')); return;
    }
    if (!gTokenClient){
      gTokenClient = google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID, scope:GOOGLE_DRIVE_SCOPE, callback:() => {},
      });
    }
    gTokenClient.callback = (resp) => {
      if (resp.error){ reject(new Error(resp.error)); return; }
      gAccessToken = resp.access_token;
      gTokenExpiresAt = Date.now() + (resp.expires_in || 3600)*1000;
      resolve(gAccessToken);
    };
    gTokenClient.requestAccessToken({ prompt: gAccessToken ? '' : 'consent' });
  });
}

async function findDriveFile(token){
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
    { headers:{ Authorization:`Bearer ${token}` } });
  if (!res.ok) return null;
  const d = await res.json();
  return (d.files && d.files[0]) ? d.files[0].id : null;
}

async function backupToGoogleDrive(){
  if (!gdriveConfigured()){ showToast('Falta configurar el Client ID de Google'); return; }
  S.googleDrive.syncing = true; S.googleDrive.error = null; render();
  refreshSheetIfOpen('update', openUpdateSheet);
  try{
    const token = await gdriveGetToken();
    const payload = JSON.stringify(backupPayload(), null, 2);
    let fileId = S.googleDrive.fileId || await findDriveFile(token);

    if (fileId){
      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method:'PATCH', headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' }, body:payload });
      if (!res.ok) throw new Error('No se pudo actualizar el respaldo');
    } else {
      const boundary = 'cyclist_boundary';
      const meta = { name:DRIVE_FILE, mimeType:'application/json' };
      const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
                   `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST', headers:{ Authorization:`Bearer ${token}`, 'Content-Type':`multipart/related; boundary=${boundary}` }, body });
      if (!res.ok) throw new Error('No se pudo crear el respaldo');
      fileId = (await res.json()).id;
    }
    S.googleDrive.fileId = fileId;
    S.googleDrive.lastBackupAt = new Date().toISOString();
    showToast('Respaldo guardado en Drive');
  }catch(e){
    S.googleDrive.error = e.message || 'No se pudo guardar en Drive';
    showToast(S.googleDrive.error);
  }finally{
    S.googleDrive.syncing = false; await persist(); render();
    refreshSheetIfOpen('update', openUpdateSheet);
  }
}

async function restoreFromGoogleDrive(){
  if (!gdriveConfigured()){ showToast('Falta configurar el Client ID de Google'); return; }
  if (!window.confirm('Esto reemplaza los datos de este dispositivo con el último respaldo de Drive. ¿Seguir?')) return;
  S.googleDrive.syncing = true; S.googleDrive.error = null; render();
  refreshSheetIfOpen('update', openUpdateSheet);
  try{
    const token = await gdriveGetToken();
    const fileId = S.googleDrive.fileId || await findDriveFile(token);
    if (!fileId) throw new Error('Todavía no hay ningún respaldo en tu Drive');
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
      { headers:{ Authorization:`Bearer ${token}` } });
    if (!res.ok) throw new Error('No se pudo descargar el respaldo');
    applyRestored(await res.json());
    S.googleDrive.fileId = fileId;
    showToast('Datos restaurados desde Drive');
  }catch(e){
    S.googleDrive.error = e.message || 'No se pudo restaurar';
    showToast(S.googleDrive.error);
  }finally{
    S.googleDrive.syncing = false; await persist(); render();
    refreshSheetIfOpen('update', openUpdateSheet);
  }
}

/* ============================================================
   ACTUALIZAR LA APP DESDE GITHUB
============================================================ */
const GH_OWNER = 'martellscs-blip';
const GH_REPO = 'Cyclist';
const GH_PATH = 'index.html';
const GH_TOKEN_KEY = 'cyclist-gh-token';
let ghFileContent = null;

function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }

function openUpdateSheet(){
  activeSheet = 'update';
  let saved = '';
  try{ saved = localStorage.getItem(GH_TOKEN_KEY) || ''; }catch(e){ saved = ''; }
  const last = S.github.lastUpdatedAt
    ? new Date(S.github.lastUpdatedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    : 'Todavía no se ha actualizado desde aquí.';
  openSheet('Sincronizar y actualizar', `
    <div class="eyebrow b">Strava</div>
    <div style="margin-top:10px">${renderStravaCard()}</div>

    <div class="zrule">${ZONES.map(z=>`<i style="background:${z.hex}"></i>`).join('')}</div>

    <div class="eyebrow b">Respaldo</div>
    <div style="margin-top:10px">${renderBackupCard()}</div>

    <div class="zrule">${ZONES.map(z=>`<i style="background:${z.hex}"></i>`).join('')}</div>

    <div class="eyebrow b">Actualizar la app (GitHub)</div>
    <div class="hint" style="margin-top:8px">Descarga el <b>index.html</b> nuevo, escógelo aquí y súbelo. La app hace el commit sola.</div>
    <div class="drop" id="ghDrop" data-gh-pick="1">${icon('upload',18)} <span id="ghLabel">Escoger el archivo descargado</span></div>
    <input type="file" id="ghFile" accept=".html,text/html" style="display:none">
    <div class="lbl">Token de GitHub</div>
    <input type="password" id="ghToken" class="inp" placeholder="github_pat_…" value="${escapeHtml(saved)}">
    <div class="hint">Se guarda solo en este teléfono. Usa un token con permiso de escritura únicamente sobre este repositorio.</div>
    <button class="btn" style="margin-top:16px" id="ghUpload" data-gh-upload="1">${icon('upload',15)} Subir a GitHub</button>
    <button class="link" style="display:block;margin:14px auto 0" data-toggle-adv="1">Datos del repositorio</button>
    <div class="foldable" id="advBox">Repositorio: ${GH_OWNER}/${GH_REPO}<br>Archivo: ${GH_PATH}<br>${last}</div>
  `);
}

async function uploadToGithub(){
  const btn = document.getElementById('ghUpload');
  const token = (document.getElementById('ghToken') || {}).value?.trim() || '';
  if (!ghFileContent){ showToast('Primero escoge el archivo index.html'); return; }
  if (!token){ showToast('Falta el token de GitHub'); return; }
  try{ localStorage.setItem(GH_TOKEN_KEY, token); }catch(e){ /* sin localStorage el token no se recuerda */ }
  if (btn){ btn.disabled = true; btn.textContent = 'Subiendo…'; }
  try{
    const headers = { Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
    const get = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, { headers });
    const sha = get.ok ? (await get.json()).sha : undefined;   // sin sha = archivo nuevo
    const put = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {
      method:'PUT', headers:{ ...headers, 'Content-Type':'application/json' },
      body:JSON.stringify({ message:`Actualiza ${GH_PATH} desde CYCLIST`, content:utf8ToBase64(ghFileContent), sha }),
    });
    if (!put.ok){
      const err = await put.json().catch(()=>({}));
      throw new Error(err.message || 'No se pudo subir el archivo');
    }
    S.github.lastUpdatedAt = new Date().toISOString();
    await persist();
    closeModal();
    ghFileContent = null;
    showToast('CYCLIST actualizado. Recarga en un momento.');
  }catch(e){
    showToast(e.message || 'No se pudo subir el archivo');
  }finally{
    if (btn){ btn.disabled = false; btn.innerHTML = `${icon('upload',15)} Subir a GitHub`; }
  }
}

/* ============================================================
   RENDER PRINCIPAL
============================================================ */
function render(){
  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.tab === S.tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  const main = document.getElementById('main');
  if (S.tab === 'home') main.innerHTML = renderHome();
  else if (S.tab === 'plan') main.innerHTML = renderPlan();
  else if (S.tab === 'form') main.innerHTML = renderForm();
  else if (S.tab === 'rides') main.innerHTML = renderRides();

  if (S.tab === 'plan'){
    requestAnimationFrame(() => {
      const strip = document.querySelector('.chips');
      const active = strip && strip.querySelector('.chip.active');
      if (strip && active) strip.scrollLeft = Math.max(0, active.offsetLeft - strip.clientWidth/2 + active.clientWidth/2);
    });
  }
}

/* ============================================================
   EVENTOS
============================================================ */
document.addEventListener('click', (e) => {
  const hit = sel => e.target.closest(sel);

  const nav = hit('[data-tab]');
  if (nav){ S.tab = nav.dataset.tab; window.scrollTo(0,0); render(); return; }

  const goto = hit('[data-goto]');
  if (goto){ S.tab = goto.dataset.goto; window.scrollTo(0,0); render(); return; }

  const week = hit('[data-week]');
  if (week){ S.selectedWeek = parseInt(week.dataset.week,10); render(); return; }

  const ses = hit('[data-session]');
  if (ses){
    const k = ses.dataset.session;
    if (S.sessionsDone[k]) delete S.sessionsDone[k]; else S.sessionsDone[k] = true;
    persist(); render(); return;
  }

  const day = hit('[data-day]');
  if (day){
    const ds = day.dataset.day;
    const acts = ridesArray().filter(a => a.date === ds);
    if (acts.length) openRideSheet(acts[0].id);
    else {
      if (S.rideDays.includes(ds)) S.rideDays = S.rideDays.filter(d => d !== ds);
      else S.rideDays.push(ds);
      persist(); render();
    }
    return;
  }

  const cal = hit('[data-cal]');
  if (cal){
    const d = parseInt(cal.dataset.cal,10);
    S.calendarView = new Date(S.calendarView.getFullYear(), S.calendarView.getMonth()+d, 1);
    render(); return;
  }

  const planMonth = hit('[data-plan-month]');
  if (planMonth){
    const d = parseInt(planMonth.dataset.planMonth,10);
    S.planMonth = new Date(S.planMonth.getFullYear(), S.planMonth.getMonth()+d, 1);
    render(); return;
  }
  if (hit('[data-plan-today]')){
    S.planMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    render(); return;
  }

  const ride = hit('[data-ride]');
  if (ride){ openRideSheet(ride.dataset.ride); return; }

  if (hit('[data-open-profile]')){ openProfileSheet(); return; }
  if (hit('[data-open-maint]')){ openMaintenanceSheet(); return; }
  if (hit('[data-open-update]')){ openUpdateSheet(); return; }
  if (hit('[data-save-profile]')){ saveProfile(); return; }
  if (hit('[data-save-strava]')){ saveStravaCfg(); return; }
  if (hit('[data-comp-save]')){ saveComponents(); return; }

  const compAdd = hit('[data-comp-add]');
  if (compAdd){
    S.components.push({ id:'c_'+Date.now(), name:'Pieza nueva', startDate:fmt(today), thresholdKm:3000 });
    openMaintenanceSheet(); return;
  }
  const compDel = hit('[data-comp-del]');
  if (compDel){
    S.components.splice(parseInt(compDel.dataset.compDel,10), 1);
    openMaintenanceSheet(); return;
  }

  const useFtp = hit('[data-use-ftp]');
  if (useFtp){
    setFtp(parseInt(useFtp.dataset.useFtp,10), 'estimado con tus datos');
    rebuildPlan(); persist(); showToast('FTP actualizado'); render(); return;
  }

  const adv = hit('[data-toggle-adv]');
  if (adv){
    const box = document.getElementById('advBox');
    if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block';
    return;
  }

  if (hit('[data-close]')){ closeModal(); return; }
  const ov = hit('[data-overlay]');
  if (ov && e.target === ov){ closeModal(); return; }

  const bk = hit('[data-backup]');
  if (bk){ openBackupSheet(bk.dataset.backup); return; }

  if (hit('[data-copy-backup]')){
    const ta = document.getElementById('backupText');
    navigator.clipboard.writeText(ta.value)
      .then(() => showToast('Respaldo copiado'))
      .catch(() => { ta.focus(); ta.select(); showToast('Selecciona el texto y cópialo'); });
    return;
  }
  if (hit('[data-restore-backup]')){ restoreBackup(document.getElementById('backupText').value); return; }

  if (hit('[data-strava-connect]')){ window.location.href = stravaAuthUrl(); return; }
  if (hit('[data-strava-sync]')){ syncStrava(false); return; }
  if (hit('[data-strava-disconnect]')){
    if (window.confirm('¿Desconectar Strava? Tus salidas ya guardadas se quedan aquí.')) disconnectStrava();
    return;
  }
  if (hit('[data-gdrive-backup]')){ backupToGoogleDrive(); return; }
  if (hit('[data-gdrive-restore]')){ restoreFromGoogleDrive(); return; }

  if (hit('[data-gh-pick]')){ const i = document.getElementById('ghFile'); if (i) i.click(); return; }
  if (hit('[data-gh-upload]')){ uploadToGithub(); return; }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'ghFile'){
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      ghFileContent = r.result;
      const lbl = document.getElementById('ghLabel'), drop = document.getElementById('ghDrop');
      if (lbl) lbl.textContent = f.name;
      if (drop) drop.classList.add('has');
    };
    r.onerror = () => showToast('No se pudo leer el archivo');
    r.readAsText(f, 'UTF-8');
  }
});

window.addEventListener('resize', () => { if (S.tab === 'form') render(); });

  S.selectedWeek = currentWeekIndex();
  render();
  await handleStravaRedirect();
  if (stravaConnected()) syncStrava(true);
});

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => { /* sin service worker la app funciona igual */ });
}
