<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYCLIST</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#06090F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CYCLIST">
<meta name="description" content="Entrenamiento de ciclismo con datos de Strava: potencia, carga, forma y plan periodizado.">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

/* ============================================================
   TOKENS
   Paleta derivada de las zonas de potencia de Coggan: el cromo
   es frío (pantalla de ciclocomputador) para que los colores de
   zona sigan leyéndose como dato y no como decoración.
============================================================ */
:root{
  --bg:#06090F;
  --panel:#0E141C;
  --panel-2:#141C26;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.14);

  --txt:#E9F1F5;
  --txt-2:rgba(233,241,245,.62);
  --txt-3:rgba(233,241,245,.40);

  --brand:#00E1C4;
  --brand-2:#00A98F;
  --brand-soft:rgba(0,225,196,.12);

  --ok:#3FDD8E;
  --warn:#FFB020;
  --risk:#FF5C6E;
  --strava:#FC5200;
  --drive:#8AB4F8;

  --z1:#3D7DD6;
  --z2:#35C88A;
  --z3:#E8C547;
  --z4:#F0883B;
  --z5:#E5484D;
  --z6:#A855F7;
  --z7:#E6EDF3;

  --safe-b: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#000}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--txt);
  display:flex;justify-content:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.num{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.app{
  width:100%;max-width:480px;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(6,9,15,.92);backdrop-filter:blur(12px);
  padding:16px 18px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.badge{width:42px;height:42px;flex-shrink:0;border-radius:11px;overflow:hidden;box-shadow:0 2px 10px rgba(0,225,196,.18)}
.badge img{width:100%;height:100%;display:block}
.brand{flex:1;min-width:0}
.brand .title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1;letter-spacing:.06em}
.brand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);margin-top:2px;font-weight:600}
.hbtn{
  width:34px;height:34px;border-radius:999px;flex-shrink:0;
  background:rgba(255,255,255,.05);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;color:var(--txt-2);
}
.hbtn:active{background:var(--brand-soft);color:var(--brand)}
.zone-strip{height:2px;display:flex;width:100%}
.zone-strip i{flex:1;display:block}

/* ---------- Layout ---------- */
main{flex:1;padding-bottom:calc(96px + var(--safe-b))}
.px{padding-left:18px;padding-right:18px}
.sec{margin-top:22px}
.eyebrow{
  font-size:10px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--txt-3);font-weight:600;
}
.eyebrow.b{color:var(--brand)}
.h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:21px;line-height:1.1;margin-top:3px}
.muted{color:var(--txt-2);font-size:13px;line-height:1.55}
.tiny{font-size:11px;color:var(--txt-3);line-height:1.5}

.rule{height:1px;background:var(--line);margin:14px 0}
/* Regla de zonas: divisor que codifica el espectro Z1→Z7 */
.zrule{height:3px;border-radius:2px;margin:16px 0;display:flex;overflow:hidden;opacity:.55}
.zrule i{flex:1}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card + .card{margin-top:10px}
.card-b{border-color:rgba(0,225,196,.28)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.metric .k{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.metric .v{font-size:23px;line-height:1.05;margin-top:5px}
.metric .u{font-size:11px;color:var(--txt-3);font-weight:600;margin-left:2px;font-family:'Inter',sans-serif}
.metric .s{font-size:11px;margin-top:3px;font-weight:600;color:var(--txt-2)}
.good{color:var(--ok)} .bad{color:var(--risk)} .warnc{color:var(--warn)} .brandc{color:var(--brand)}

/* ---------- Hero: medidor de forma (TSB) ---------- */
.hero{
  margin-top:18px;border-radius:20px;padding:18px 18px 16px;
  background:
    radial-gradient(120% 100% at 12% 0%, rgba(0,225,196,.16), transparent 62%),
    linear-gradient(180deg,#111A24,#0B1119);
  border:1px solid rgba(255,255,255,.09);
  position:relative;overflow:hidden;
}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .tsb{font-size:56px;line-height:.9;margin-top:6px}
.hero .state{font-size:14px;font-weight:700;margin-top:6px}
.hero .why{font-size:12px;color:var(--txt-2);margin-top:5px;line-height:1.5}
.gauge{margin-top:14px}
.gauge .bar{height:9px;border-radius:999px;position:relative;overflow:visible;
  background:linear-gradient(90deg,#FF5C6E 0%,#F0883B 22%,#3FDD8E 48%,#00E1C4 66%,#3D7DD6 100%);}
.gauge .pin{position:absolute;top:50%;width:3px;height:22px;border-radius:2px;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(6,9,15,.85),0 0 12px rgba(255,255,255,.5);
  transition:left .7s cubic-bezier(.22,1,.36,1)}
.gauge .lbls{display:flex;justify-content:space-between;margin-top:8px;font-size:9.5px;color:var(--txt-3);letter-spacing:.04em}
.hero .cd{position:absolute;right:16px;top:16px;text-align:right}
.hero .cd .n{font-size:32px;line-height:1;color:var(--brand)}
.hero .cd .l{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

/* ---------- Barra de progreso genérica ---------- */
.track{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .6s cubic-bezier(.22,1,.36,1)}

/* ---------- Botones ---------- */
.btn{
  width:100%;border-radius:13px;padding:12px;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#04140F;
}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.45}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--txt-2);font-weight:600}
.btn-strava{background:var(--strava);color:#fff}
.btn-drive{background:#0B2545;border:1px solid rgba(138,180,248,.4);color:var(--drive)}
.link{font-size:11px;color:var(--txt-3);text-decoration:underline;background:none}
.link-b{font-size:11px;color:var(--brand);font-weight:700;text-decoration:underline}

/* ---------- Chips de semana ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;width:58px;height:64px;border-radius:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--txt-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.chip .s{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.7}
.chip .n{font-size:20px;line-height:1}
.chip .ph{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.active{background:var(--brand);border-color:var(--brand);color:#04140F}
.chip.now{box-shadow:0 0 0 1px var(--brand) inset}

/* ---------- Sesión ---------- */
.ses{
  width:100%;text-align:left;border-radius:15px;padding:14px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:10px;
  border-left:3px solid var(--zc,var(--line-2));
  transition:transform .1s;
}
.ses:active{transform:scale(.99)}
.ses.done{background:rgba(0,225,196,.06);border-color:rgba(0,225,196,.32);border-left-color:var(--brand)}
.ses .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ses .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--zc,var(--txt-2))}
.ses .when{font-size:11px;color:var(--txt-3)}
.ses .name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;margin-top:4px}
.ses .desc{font-size:13px;color:var(--txt-2);line-height:1.5;margin-top:4px}
.ses .foot{display:flex;gap:12px;margin-top:9px;font-size:11px;color:var(--txt-3);flex-wrap:wrap}
.ses .foot b{color:var(--txt-2);font-weight:600}
.tick{width:20px;height:20px;border-radius:999px;border:2px solid var(--line-2);flex-shrink:0}
.tick.on{border-color:var(--brand);background:var(--brand)}

/* ---------- Calendario ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{padding:6px;border-radius:999px;background:rgba(255,255,255,.05);display:flex}
.cal-month{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:9.5px;color:var(--txt-3);font-weight:600;padding:3px 0;letter-spacing:.06em}
.cal-day{
  aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  font-size:12.5px;font-weight:500;background:rgba(255,255,255,.035);color:var(--txt-2);position:relative;
}
.cal-day.ride{background:var(--brand);color:#04140F;font-weight:700}
.cal-day.today{box-shadow:0 0 0 2px var(--brand)}
.cal-day .kms{font-size:8.5px;font-weight:700;opacity:.85}
.cal-day .dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:999px;background:rgba(0,225,196,.55)}
.legend{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--txt-3);align-items:center}
.legend .sq{width:11px;height:11px;border-radius:3px;background:var(--brand);display:inline-block;margin-right:5px;vertical-align:-1px}
.legend .dt{width:6px;height:6px;border-radius:999px;background:rgba(0,225,196,.55);display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- Filas ---------- */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{font-size:13px;font-weight:600}
.row .l small{display:block;font-size:11px;color:var(--txt-3);font-weight:400;margin-top:2px}
.row .r{text-align:right}
.row .r b{font-size:14px;color:var(--brand);font-family:'Barlow Condensed',sans-serif;font-weight:700}
.row .r small{display:block;font-size:10px;color:var(--txt-3);margin-top:1px}

/* ---------- Zonas ---------- */
.zbar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05)}
.zbar i{display:block;height:100%}
.zlist{margin-top:10px}
.zrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.zrow:last-child{border-bottom:none}
.zdot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.zrow .nm{flex:1;font-weight:600}
.zrow .rg{color:var(--txt-3);font-size:11px}
.zrow .pc{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;min-width:42px;text-align:right}

/* ---------- Charts ---------- */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;height:180px}
.chart canvas{width:100%;height:100%;display:block}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--txt-3)}
.chart-legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* ---------- Nav ---------- */
nav.bnav{
  position:fixed;bottom:0;width:100%;max-width:480px;z-index:30;
  background:rgba(6,9,15,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:var(--safe-b);
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--txt-3)}
.nav-btn span{font-size:9.5px;font-weight:600;letter-spacing:.03em}
.nav-btn.active{color:var(--brand)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(2,4,8,.78);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:480px;background:#0C1219;border-radius:22px 22px 0 0;
  border-top:1px solid rgba(0,225,196,.28);padding:18px 18px calc(28px + var(--safe-b));
  max-height:88vh;overflow-y:auto;
  animation:up .22s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px}
.x{padding:6px;border-radius:999px;background:rgba(255,255,255,.06)}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--txt-3);margin-top:14px;font-weight:600}
.inp{width:100%;background:rgba(0,0,0,.42);border:1px solid var(--line-2);border-radius:11px;
  padding:11px 12px;color:var(--txt);font-size:14px;margin-top:6px}
.inp:focus{outline:none;border-color:var(--brand)}
.hint{font-size:11px;color:var(--txt-3);margin-top:5px;line-height:1.5}
.sheet textarea.inp{min-height:150px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line-2);
  border-radius:13px;padding:18px;margin-top:10px;color:var(--txt-2);font-size:13px;font-weight:600;text-align:center}
.drop.has{border-color:var(--brand);color:var(--brand)}
.foldable{display:none;margin-top:10px;font-size:11px;color:var(--txt-3);line-height:1.65}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:calc(88px + var(--safe-b));left:50%;transform:translateX(-50%);
  background:var(--brand);color:#04140F;font-size:13.5px;font-weight:700;padding:10px 18px;
  border-radius:999px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:88%;text-align:center}

/* ---------- Estado vacío ---------- */
.empty{border:1px dashed var(--line-2);border-radius:15px;padding:20px;text-align:center}
.empty .t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px}
.empty .d{font-size:12.5px;color:var(--txt-2);margin-top:5px;line-height:1.55}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>

function fmt(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function secToHMS(sec){
  sec = Math.round(sec || 0);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function secToDur(sec){
  sec = Math.round(sec || 0);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}m`;
}
function durLabel(sec){
  if (sec < 60) return `${sec}s`;
  if (sec % 60 === 0) return `${sec/60} min`;
  return `${Math.round(sec/60)} min`;
}

/* ============================================================
   ZONAS DE POTENCIA (modelo clásico de 7 zonas de Coggan,
   expresadas como % del FTP)
============================================================ */
const ZONES = [
  { key:'z1', n:1, name:'Recuperación', lo:0.00, hi:0.55, color:'var(--z1)', hex:'#3D7DD6', why:'Rodar suelto, acelera la recuperación sin sumar fatiga.' },
  { key:'z2', n:2, name:'Resistencia',  lo:0.56, hi:0.75, color:'var(--z2)', hex:'#35C88A', why:'La base aeróbica: mitocondrias, capilares y uso de grasa.' },
  { key:'z3', n:3, name:'Tempo',        lo:0.76, hi:0.90, color:'var(--z3)', hex:'#E8C547', why:'Ritmo sostenido de fondo; útil pero cansa más de lo que aporta si abusas.' },
  { key:'z4', n:4, name:'Umbral',       lo:0.91, hi:1.05, color:'var(--z4)', hex:'#F0883B', why:'Sube tu FTP: es el ritmo que puedes sostener ~1 hora.' },
  { key:'z5', n:5, name:'VO₂ máx',      lo:1.06, hi:1.20, color:'var(--z5)', hex:'#E5484D', why:'Amplía el techo aeróbico. Muy exigente, poca dosis basta.' },
  { key:'z6', n:6, name:'Anaeróbico',   lo:1.21, hi:1.50, color:'var(--z6)', hex:'#A855F7', why:'Capacidad anaeróbica: ataques y repechos cortos.' },
  { key:'z7', n:7, name:'Neuromuscular',lo:1.51, hi:99,   color:'var(--z7)', hex:'#E6EDF3', why:'Sprint puro, potencia máxima de pocos segundos.' },
];
/* La clasificación busca la primera zona cuyo tope (hi) alcanza o supera al
   valor: como ZONES está ordenado de forma ascendente y cada hi es el techo
   de esa zona, cualquier valor real (no solo los redondeados de la tabla)
   cae siempre en una zona, sin huecos entre los límites publicados. */
function zoneOf(watts, ftp){
  if (!ftp) return null;
  const r = watts / ftp;
  for (const z of ZONES) if (r <= z.hi) return z;
  return ZONES[ZONES.length - 1];
}
function zoneWatts(z, ftp){
  if (!ftp) return '';
  const lo = Math.round(z.lo * ftp);
  const hi = z.hi >= 99 ? '∞' : Math.round(z.hi * ftp);
  return `${lo}–${hi} W`;
}

async function loadState(){
  let parsed = null;
  if (hasClaudeStorage){
    try{ const r = await window.storage.get(STORE_KEY, false); if (r && r.value) parsed = JSON.parse(r.value); }
    catch(e){ /* todavía no hay datos guardados aquí; seguimos con localStorage */ }
  }
  if (!parsed){
    try{ const raw = localStorage.getItem(STORE_KEY); if (raw) parsed = JSON.parse(raw); }
    catch(e){ /* almacenamiento no disponible: se usan los valores por defecto */ }
  }
  if (!parsed) return;

  if (parsed.profile)   S.profile   = { ...S.profile, ...parsed.profile };
  if (parsed.objective) S.objective = { ...S.objective, ...parsed.objective };
  if (parsed.planCfg)   S.planCfg   = { ...S.planCfg, ...parsed.planCfg };
  if (parsed.strava)    S.strava    = { ...S.strava, ...parsed.strava, syncing:false, analyzing:0 };
  if (parsed.stravaCfg) S.stravaCfg = { ...S.stravaCfg, ...parsed.stravaCfg };
  if (parsed.googleDrive) S.googleDrive = { ...S.googleDrive, ...parsed.googleDrive, syncing:false };
  if (parsed.github)    S.github    = { ...S.github, ...parsed.github };

  if (Array.isArray(parsed.ftpHistory)) S.ftpHistory = parsed.ftpHistory;
  if (Array.isArray(parsed.rideDays))   S.rideDays   = parsed.rideDays;
  if (Array.isArray(parsed.components) && parsed.components.length) S.components = parsed.components;
  if (Array.isArray(parsed.events))     S.events     = parsed.events;

  if (parsed.sessionsDone   && typeof parsed.sessionsDone === 'object')   S.sessionsDone   = parsed.sessionsDone;
  if (parsed.activities     && typeof parsed.activities === 'object')     S.activities     = parsed.activities;
  if (parsed.analysis       && typeof parsed.analysis === 'object')       S.analysis       = parsed.analysis;
  if (parsed.analysisFailed && typeof parsed.analysisFailed === 'object') S.analysisFailed = parsed.analysisFailed;
}

let persistTimer = null;
async function persist(){
  const payload = JSON.stringify(statePayload());
  let ok = false;
  if (hasClaudeStorage){
    try{ await window.storage.set(STORE_KEY, payload, false); ok = true; }
    catch(e){ /* intentamos localStorage como respaldo */ }
  }
  if (!ok){
    try{ localStorage.setItem(STORE_KEY, payload); ok = true; }
    catch(e){ /* sin espacio o sin permiso */ }
  }
  if (!ok) showToast('No se pudo guardar. Libera espacio e inténtalo otra vez.');
  return ok;
}

async function exchangeStravaCode(code){
  try{
    const res = await fetch('https://www.strava.com/oauth/token', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        client_id:S.stravaCfg.clientId, client_secret:S.stravaCfg.clientSecret,
        code, grant_type:'authorization_code',
      }),
    });
    if (!res.ok) throw new Error('token');
    const d = await res.json();
    S.strava.accessToken = d.access_token;
    S.strava.refreshToken = d.refresh_token;
    S.strava.expiresAt = d.expires_at;
    S.strava.athleteId = d.athlete && d.athlete.id;
    S.strava.athleteName = d.athlete ? `${d.athlete.firstname||''} ${d.athlete.lastname||''}`.trim() : null;
    if (d.athlete && d.athlete.weight && !S.profile.weightKg) S.profile.weightKg = Math.round(d.athlete.weight);
    if (d.athlete && d.athlete.ftp && !S.profile.ftp) setFtp(d.athlete.ftp, 'Strava');
    S.strava.error = null;
    await persist();
    showToast('Strava conectado');
    return true;
  }catch(e){
    S.strava.error = 'No se pudo conectar con Strava. Revisa el ID y el secreto en Ajustes.';
    showToast('No se pudo conectar con Strava');
    return false;
  }
}

async function refreshStravaTokenIfNeeded(){
  if (!stravaConnected()) return false;
  const nowSec = Math.floor(Date.now()/1000);
  if (S.strava.expiresAt && S.strava.expiresAt - nowSec > 300) return true;
  try{
    const res = await fetch('https://www.strava.com/oauth/token', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        client_id:S.stravaCfg.clientId, client_secret:S.stravaCfg.clientSecret,
        refresh_token:S.strava.refreshToken, grant_type:'refresh_token',

async function syncStrava(silent){
  if (!stravaConnected()) return;
  if (S.strava.syncing) return;
  const ok = await refreshStravaTokenIfNeeded();
  if (!ok){ render(); refreshSheetIfOpen('update', openUpdateSheet); return; }

  S.strava.syncing = true;
  if (!silent) render();
  refreshSheetIfOpen('update', openUpdateSheet);

  try{
    const after = S.strava.lastSyncEpoch
      || Math.floor((Date.now() - INITIAL_LOOKBACK_DAYS*DAY_MS)/1000);
    let page = 1, newCount = 0, maxEpoch = after;

    while (page <= 10){
      const p = new URLSearchParams({ after:String(after), per_page:'100', page:String(page) });
      const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?${p.toString()}`, {
        headers:{ Authorization:`Bearer ${S.strava.accessToken}` },
      });
      if (res.status === 429) throw new Error('Strava está limitando las peticiones. Espera 15 minutos.');
      if (!res.ok) throw new Error('No se pudieron leer tus actividades');
      const list = await res.json();
      if (!list.length) break;

      for (const act of list){
        const sportType = act.sport_type || act.type;
        if (!RIDE_TYPES.includes(sportType)) continue;   // solo ciclismo
        const epoch = Math.floor(new Date(act.start_date).getTime()/1000);
        if (epoch > maxEpoch) maxEpoch = epoch;
        const mapped = mapActivity(act);
        S.activities[act.id] = mapped;
        newCount++;
        if (!S.rideDays.includes(mapped.date)) S.rideDays.push(mapped.date);
        autoMarkSession(parseDate(mapped.date));
      }
      if (list.length < 100) break;
      page++;
    }

    S.strava.lastSyncEpoch = maxEpoch;
    S.strava.lastSyncAt = new Date().toISOString();
    S.strava.error = null;
    await persist();
    if (newCount > 0 && !silent) showToast(`${newCount} salida(s) sincronizada(s)`);

    await analyzePendingStreams(silent);
  }catch(e){
    S.strava.error = e.message || 'No se pudo sincronizar con Strava';
    if (!silent) showToast(S.strava.error);
  }finally{
    S.strava.syncing = false;
    render();
    refreshSheetIfOpen('update', openUpdateSheet);
  }
}

async function handleStravaRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code'), error = params.get('error');
  if (error){

/* ------------------------------------------------------------
   ANÁLISIS DE FLUJOS (streams)
   De aquí salen la curva de potencia real, el tiempo en zonas
   y el desacople Pw:Hr. Solo se descargan unas pocas salidas por
   sincronización para no topar el límite de la API de Strava.
------------------------------------------------------------ */
function pendingStreamIds(){
  return Object.values(S.activities)
    .filter(a => !S.analysis[a.id] && !S.analysisFailed[a.id])
    .filter(a => a.movingTimeSec >= 300)               // salidas de menos de 5 min no aportan
    .filter(a => a.deviceWatts || a.avgHr)             // necesitamos potencia real o pulso
    .sort((a,b) => b.startLocal.localeCompare(a.startLocal))   // primero las más recientes
    .map(a => a.id);
}

async function analyzePendingStreams(silent){
  const ids = pendingStreamIds().slice(0, MAX_STREAM_FETCHES);
  if (!ids.length) return;
  S.strava.analyzing = ids.length;
  if (!silent) render();

  for (const id of ids){
    try{
      const url = `https://www.strava.com/api/v3/activities/${id}/streams?keys=time,watts,heartrate,cadence&key_by_type=true`;
      const res = await fetch(url, { headers:{ Authorization:`Bearer ${S.strava.accessToken}` } });
      if (res.status === 429){ S.strava.error = 'Strava limitó las peticiones; el análisis sigue en la próxima sincronización.'; break; }
      if (!res.ok){ S.analysisFailed[id] = true; continue; }
      const st = await res.json();
      const analysis = analyzeStreams(st, S.activities[id]);
      if (analysis) S.analysis[id] = analysis; else S.analysisFailed[id] = true;
    }catch(e){
      S.analysisFailed[id] = true;
    }
    S.strava.analyzing = Math.max(0, S.strava.analyzing - 1);
    await new Promise(r => setTimeout(r, 250));   // espaciado amable con la API
  }
  S.strava.analyzing = 0;
  await persist();
}

/* Convierte los flujos crudos en un eje de tiempo en movimiento + series limpias */
function normalizeStreams(st){
  const time = st.time && st.time.data;
  if (!time || time.length < 30) return null;
  const watts = (st.watts && st.watts.data) || null;
  const hr = (st.heartrate && st.heartrate.data) || null;
  const cad = (st.cadence && st.cadence.data) || null;
  const n = time.length;
  const tm = new Float64Array(n);          // segundos de tiempo en movimiento
  const dt = new Float64Array(n);
  for (let i=1;i<n;i++){
    const raw = time[i] - time[i-1];
    // Un hueco largo es una pausa: lo puenteamos con 1 s para no diluir los promedios.
    const step = (raw > 0 && raw <= 10) ? raw : 1;
    dt[i] = step;
    tm[i] = tm[i-1] + step;
  }
  return { n, tm, dt, watts, hr, cad };
}

function analyzeStreams(st, act){
  const s = normalizeStreams(st);
  if (!s) return null;
  const out = { at:new Date().toISOString() };

  if (s.watts){
    out.mmp = meanMaximalPower(s.tm, s.watts);
    out.np = normalizedPower(s.tm, s.dt, s.watts);
    const avg = weightedMean(s.watts, s.dt);
    out.avgW = Math.round(avg);
    out.vi = avg > 0 ? +(out.np/avg).toFixed(3) : null;
    out.zoneSec = timeInPowerZones(s.watts, s.dt);
    out.hasPower = true;
  }
  if (s.hr){
    out.hrZoneSec = timeInHrZones(s.hr, s.dt);
    out.avgHrCalc = Math.round(weightedMean(s.hr, s.dt, v => v > 30));
  }
  if (s.watts && s.hr && act && act.movingTimeSec >= 2400){
    out.decoupling = powerHrDecoupling(s);
  }
  if (s.cad){
    out.avgCadPedaling = Math.round(weightedMean(s.cad, s.dt, v => v > 20));
  }
  return out;
}

function weightedMean(arr, dt, filter){
  let sum = 0, w = 0;
  for (let i=1;i<arr.length;i++){
    const v = arr[i];
    if (v === null || v === undefined) continue;
    if (filter && !filter(v)) continue;
    sum += v * dt[i]; w += dt[i];
  }
  return w > 0 ? sum/w : 0;
}

/* Mejor potencia media para cada duración (curva de potencia) */
function meanMaximalPower(tm, watts){
  const n = tm.length;
  const cum = new Float64Array(n);
  for (let i=1;i<n;i++){
    cum[i] = cum[i-1] + ((watts[i]||0) + (watts[i-1]||0))/2 * (tm[i]-tm[i-1]);
  }
  const total = tm[n-1];
  const out = {};
  for (const D of CURVE_DURATIONS){
    if (total < D) continue;
    let best = 0, j = 0;
    for (let i=0;i<n;i++){
      while (j+1 <= i && tm[i]-tm[j+1] >= D) j++;
      const span = tm[i]-tm[j];
      if (span >= D){
        const avg = (cum[i]-cum[j])/span;
        if (avg > best) best = avg;
      }
    }
    if (best > 0) out[D] = Math.round(best);
  }
  return out;
}

/* Potencia normalizada: media móvil de 30 s, elevada a la 4, promedio, raíz cuarta */
function normalizedPower(tm, dt, watts){
  const n = tm.length;
  if (n < 30) return 0;
  let sum4 = 0, wsum = 0, acc = 0, j = 0;
  const cum = new Float64Array(n);
  for (let i=1;i<n;i++) cum[i] = cum[i-1] + ((watts[i]||0)+(watts[i-1]||0))/2 * dt[i];
  for (let i=0;i<n;i++){
    while (j+1 <= i && tm[i]-tm[j+1] >= 30) j++;
    const span = tm[i]-tm[j];
    if (span < 30) continue;
    const avg30 = (cum[i]-cum[j])/span;
    sum4 += Math.pow(avg30, 4) * dt[i];
    wsum += dt[i];
  }
  if (wsum <= 0) return 0;
  acc = Math.pow(sum4/wsum, 0.25);
  return Math.round(acc);
}

function timeInPowerZones(watts, dt){
  const ftp = S.profile.ftp;
  const out = { z1:0,z2:0,z3:0,z4:0,z5:0,z6:0,z7:0 };
  if (!ftp) return out;
  for (let i=1;i<watts.length;i++){
    const z = zoneOf(watts[i]||0, ftp);
    if (z) out[z.key] += dt[i];
  }
  Object.keys(out).forEach(k => out[k] = Math.round(out[k]));
  return out;
}

function timeInHrZones(hr, dt){
  const max = S.profile.maxHr;
  const out = { z1:0,z2:0,z3:0,z4:0,z5:0 };
  if (!max) return out;
  for (let i=1;i<hr.length;i++){
    const r = (hr[i]||0)/max;
    const k = r < 0.60 ? 'z1' : r < 0.70 ? 'z2' : r < 0.80 ? 'z3' : r < 0.90 ? 'z4' : 'z5';
    out[k] += dt[i];
  }
  Object.keys(out).forEach(k => out[k] = Math.round(out[k]));
  return out;
}

/* Desacople Pw:Hr — cuánto se degrada la relación potencia/pulso en la 2ª mitad */
function powerHrDecoupling(s){
  const half = s.tm[s.n-1]/2;
  let p1=0,w1=0,h1=0,p2=0,w2=0,h2=0;
  for (let i=1;i<s.n;i++){
    const w = s.watts[i]||0, h = s.hr[i]||0;
    if (h < 60) continue;
    if (s.tm[i] <= half){ p1 += w*s.dt[i]; h1 += h*s.dt[i]; w1 += s.dt[i]; }
    else { p2 += w*s.dt[i]; h2 += h*s.dt[i]; w2 += s.dt[i]; }
  }
  if (w1 < 300 || w2 < 300) return null;
  const r1 = (p1/w1)/(h1/w1), r2 = (p2/w2)/(h2/w2);
  if (!isFinite(r1) || r1 <= 0) return null;
  return +(((r1-r2)/r1)*100).toFixed(1);
}

/* ============================================================
   MOTOR DE ENTRENAMIENTO
   Todo lo de abajo son modelos publicados y ampliamente usados
   (Coggan/Allen para TSS-CTL-ATL-TSB y zonas, Monod & Scherrer
   para potencia crítica, ACSM para el consumo de oxígeno).
   Son estimaciones, no mediciones de laboratorio.
============================================================ */

function countsForLoad(a){ return !EBIKE_TYPES.includes(a.sportType); }
function ridesArray(){ return Object.values(S.activities); }
function loadRides(){ return ridesArray().filter(countsForLoad); }

function setFtp(watts, source){
  const w = Math.round(watts);
  if (!(w > 0)) return;
  S.profile.ftp = w;
  S.profile.ftpSource = source || 'manual';
  S.profile.ftpDate = fmt(today);
  const last = S.ftpHistory[S.ftpHistory.length-1];
  if (!last || last.ftp !== w){
    S.ftpHistory.push({ date:fmt(today), ftp:w, source:source || 'manual' });
    S.ftpHistory.sort((a,b) => a.date.localeCompare(b.date));
  }
}

/* ---------- Carga de una salida (TSS) ---------- */
function tssFor(a){
  const t = a.movingTimeSec || 0;
  if (!t) return { tss:0, if:null, source:'sin datos' };

  const ftp = S.profile.ftp;
  const an = S.analysis[a.id];
  const np = (an && an.np) || a.npWatts || a.avgWatts;

  if (ftp && np){
    const inten = np / ftp;
    return {
      tss:(t * np * inten) / (ftp * 3600) * 100,
      if:+inten.toFixed(3), np:Math.round(np),
      source:a.deviceWatts ? 'potenciómetro' : 'potencia estimada por Strava',
    };
  }

  const maxHr = S.profile.maxHr;
  const restHr = S.profile.restHr || 55;
  const thrHr = S.profile.thresholdHr || (maxHr ? Math.round(maxHr * 0.90) : null);
  const avgHr = (an && an.avgHrCalc) || a.avgHr;   // el del stream ya excluye pausas; más preciso que el resumen de Strava
  if (avgHr && thrHr && thrHr > restHr){
    const inten = clamp((avgHr - restHr) / (thrHr - restHr), 0, 1.3);
    return { tss:(t/3600) * inten * inten * 100, if:+inten.toFixed(3), source:'frecuencia cardiaca' };
  }

  const inten = 0.68;   // supuesto conservador: salida de fondo
  return { tss:(t/3600) * inten * inten * 100, if:inten, source:'estimado por duración' };
}

function loadQuality(){
  const rides = loadRides();
  if (!rides.length) return 'sin datos';
  const withPower = rides.filter(a => a.deviceWatts).length;
  const withHr = rides.filter(a => a.avgHr).length;
  if (S.profile.ftp && withPower / rides.length >= 0.6) return 'potencia';
  if (withHr / rides.length >= 0.6) return 'pulso';
  return 'estimada';
}

/* ---------- Carta de manejo del rendimiento (CTL / ATL / TSB) ----------
   CTL = media exponencial de 42 días  → "forma de fondo" (fitness)
   ATL = media exponencial de 7 días   → "fatiga"
   TSB = CTL de ayer − ATL de ayer     → "frescura" con la que amaneces hoy
--------------------------------------------------------------------- */
function computePMC(){
  const rides = loadRides();
  if (!rides.length) return null;

  const byDay = {};
  rides.forEach(a => { byDay[a.date] = (byDay[a.date] || 0) + tssFor(a).tss; });

  const dates = Object.keys(byDay).sort();
  const start = parseDate(dates[0]);
  const days = Math.round((today - start) / DAY_MS);
  if (days < 0) return null;

  let ctl = 0, atl = 0;
  const series = [];
  for (let i=0; i<=days; i++){
    // Se reconstruye la fecha por componentes para no romperse con cambios de horario.
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = fmt(d);
    const tss = byDay[key] || 0;
    const tsb = ctl - atl;                 // frescura con la que se empieza el día
    ctl = ctl + (tss - ctl) / 42;
    atl = atl + (tss - atl) / 7;
    series.push({ date:key, tss:+tss.toFixed(1), ctl:+ctl.toFixed(1), atl:+atl.toFixed(1), tsb:+tsb.toFixed(1) });
  }
  const last = series[series.length-1];
  const prev = series[Math.max(0, series.length-8)];
  return {
    series,
    ctl:last.ctl, atl:last.atl, tsb:last.tsb,
    rampRate:+(last.ctl - prev.ctl).toFixed(1),
    days:series.length,
  };
}

function formState(tsb){
  if (tsb === null || tsb === undefined) return { label:'Sin datos', color:'var(--txt-3)',
    why:'Sincroniza Strava para calcular tu forma.' };
  if (tsb > 25)  return { label:'Muy fresco', color:'var(--z1)',
    why:'Llevas tiempo con poca carga. Bien para competir, pero si se alarga empiezas a perder fondo.' };
  if (tsb > 5)   return { label:'Fresco', color:'var(--brand)',
    why:'Estás descargado y con chispa: es el rango en el que se suele rendir mejor en un evento.' };
  if (tsb > -10) return { label:'Equilibrado', color:'var(--ok)',
    why:'Carga y descanso están parejos. Buen punto para sostener el entrenamiento.' };
  if (tsb > -30) return { label:'Cargando', color:'var(--warn)',
    why:'Zona de entrenamiento productivo: acumulas fatiga a cambio de fondo. Normal entre semana.' };
  return { label:'Fatiga alta', color:'var(--risk)',
    why:'Vas muy por debajo de −30. Mete días fáciles o de descanso antes de que se vuelva agujero.' };
}

/* ---------- Curva de potencia (mejor potencia media por duración) ---------- */
function powerCurve(){
  const out = {};
  Object.entries(S.analysis).forEach(([id, an]) => {
    if (!an || !an.mmp) return;
    const act = S.activities[id];
    Object.entries(an.mmp).forEach(([dur, w]) => {
      const d = +dur;
      if (!out[d] || w > out[d].w) out[d] = { w, date:act ? act.date : null, name:act ? act.name : '' };
    });
  });
  return out;
}

/* ---------- Potencia crítica y W′ (modelo de dos parámetros) ----------
   Trabajo = CP × tiempo + W′  →  regresión lineal sobre esfuerzos de 3 a 20 min
--------------------------------------------------------------------- */
function criticalPower(curve){
  const pts = [180, 300, 480, 600, 720, 1200]
    .filter(d => curve[d])
    .map(d => ({ t:d, w:curve[d].w * d }));
  if (pts.length < 3) return null;
  const n = pts.length;
  const st = pts.reduce((s,p)=>s+p.t,0), sw = pts.reduce((s,p)=>s+p.w,0);
  const stt = pts.reduce((s,p)=>s+p.t*p.t,0), stw = pts.reduce((s,p)=>s+p.t*p.w,0);
  const den = n*stt - st*st;
  if (den === 0) return null;
  const cp = (n*stw - st*sw) / den;
  const wPrime = (sw - cp*st) / n;
  if (!(cp > 0) || !(wPrime > 0)) return null;
  return { cp:Math.round(cp), wPrime:Math.round(wPrime), points:n };
}

/* ---------- Estimación de FTP a partir de tus datos ---------- */
function estimateFtp(){
  const curve = powerCurve();
  const cands = [];
  if (curve[3600]) cands.push({ ftp:curve[3600].w,                 why:'tu mejor hora sostenida', date:curve[3600].date });
  if (curve[1200]) cands.push({ ftp:Math.round(curve[1200].w*0.95), why:'tus mejores 20 min × 0.95', date:curve[1200].date });
  if (curve[600])  cands.push({ ftp:Math.round(curve[600].w*0.92),  why:'tus mejores 10 min × 0.92', date:curve[600].date });
  if (curve[480])  cands.push({ ftp:Math.round(curve[480].w*0.90),  why:'tus mejores 8 min × 0.90', date:curve[480].date });
  const cp = criticalPower(curve);
  if (cp) cands.push({ ftp:cp.cp, why:`modelo de potencia crítica (${cp.points} esfuerzos)`, date:null });
  if (!cands.length) return null;
  const best = cands.reduce((m,c) => c.ftp > m.ftp ? c : m, cands[0]);
  return { ...best, all:cands, cp };
}

function vo2maxEstimate(){
  const curve = powerCurve();
  const kg = S.profile.weightKg;
  if (!curve[300] || !kg) return null;
  // ACSM: VO2 (ml/kg/min) ≈ 10.8 × W / kg + 7, aplicado a la potencia máxima de 5 min
  return Math.round((10.8 * curve[300].w / kg) + 7);
}

/* Referencia de W/kg en FTP (tabla de Coggan). El ajuste por sexo refleja
   diferencias fisiológicas medias de la tabla original, no un juicio. */
const WKG_LEVELS = [
  { min:5.6, label:'Nivel profesional' },
  { min:4.8, label:'Excelente' },
  { min:4.0, label:'Muy bueno' },
  { min:3.3, label:'Bueno' },
  { min:2.6, label:'Moderado' },
  { min:1.9, label:'En construcción' },
  { min:0,   label:'Empezando' },
];
function wkgLevel(wkg){
  const shift = (S.profile.sex === 'f') ? 0.6 : 0;
  const adj = wkg + shift;
  return (WKG_LEVELS.find(l => adj >= l.min) || WKG_LEVELS[WKG_LEVELS.length-1]).label;
}

/* ---------- Reparto de tiempo en zonas (polarización) ---------- */
function zoneTotals(sinceDays){
  const cut = sinceDays ? fmt(new Date(today.getFullYear(), today.getMonth(), today.getDate() - sinceDays)) : null;
  const tot = { z1:0,z2:0,z3:0,z4:0,z5:0,z6:0,z7:0 };
  let any = false;
  Object.entries(S.analysis).forEach(([id, an]) => {
    if (!an || !an.zoneSec) return;
    const act = S.activities[id];
    if (!act || !countsForLoad(act)) return;
    if (cut && act.date < cut) return;
    ZONES.forEach(z => { tot[z.key] += an.zoneSec[z.key] || 0; });
    any = true;
  });
  const sum = Object.values(tot).reduce((a,b)=>a+b,0);
  return any && sum > 0 ? { tot, sum } : null;
}

function polarization(){
  const z = zoneTotals(56);   // últimas 8 semanas
  if (!z) return null;
  const low = z.tot.z1 + z.tot.z2;
  const mid = z.tot.z3;
  const high = z.tot.z4 + z.tot.z5 + z.tot.z6 + z.tot.z7;
  return {
    lowPct:Math.round(low/z.sum*100),
    midPct:Math.round(mid/z.sum*100),
    highPct:Math.round(high/z.sum*100),
    sum:z.sum,
  };
}

/* ---------- Eficiencia aeróbica y desacople ---------- */
function efSeries(){
  return loadRides()
    .filter(a => a.movingTimeSec >= 1800)
    .map(a => {
      const an = S.analysis[a.id];
      const np = (an && an.np) || a.npWatts || a.avgWatts;
      const hr = (an && an.avgHrCalc) || a.avgHr;
      if (!np || !hr) return null;
      const ftp = S.profile.ftp;
      if (ftp && np / ftp > 0.90) return null;    // fuera series e intervalos fuertes
      return { date:a.date, ef:+(np/hr).toFixed(3) };
    })
    .filter(Boolean)
    .sort((a,b) => a.date.localeCompare(b.date));
}

function decouplingSeries(){
  return loadRides()
    .map(a => {
      const an = S.analysis[a.id];
      if (!an || an.decoupling === null || an.decoupling === undefined) return null;
      return { date:a.date, value:an.decoupling, name:a.name };
    })
    .filter(Boolean)
    .sort((a,b) => a.date.localeCompare(b.date));
}

/* ---------- Semanas ---------- */
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const off = (x.getDay() + 6) % 7;
  return new Date(x.getFullYear(), x.getMonth(), x.getDate() - off);
}
function weekStats(start, end){
  const s = fmt(start), e = fmt(end);
  const rides = loadRides().filter(a => a.date >= s && a.date <= e);
  return {
    km:+rides.reduce((t,a)=>t+a.distanceKm,0).toFixed(1),
    tss:Math.round(rides.reduce((t,a)=>t+tssFor(a).tss,0)),
    sec:rides.reduce((t,a)=>t+a.movingTimeSec,0),
    elev:Math.round(rides.reduce((t,a)=>t+(a.elevationGain||0),0)),
    count:rides.length,
  };
}

/* ---------- Progreso mes contra mes ----------
   Es el corazón del seguimiento: compara el mes elegido contra el anterior
   usando datos reales (no el plan), para responder "¿de verdad estoy mejorando?"
--------------------------------------------------------------------- */
function valueOnDate(series, dateStr, key){
  let val = null;
  for (const p of series){ if (p.date <= dateStr) val = p[key]; else break; }
  return val;
}
function ftpOnDate(dateStr){
  let val = null;
  for (const h of S.ftpHistory){ if (h.date <= dateStr) val = h.ftp; else break; }
  return val;
}
function monthlyProgress(monthDate){
  const y = monthDate.getFullYear(), m = monthDate.getMonth();
  const isCurrent = (y === today.getFullYear() && m === today.getMonth());
  const start = new Date(y, m, 1);
  const end = isCurrent ? today : new Date(y, m+1, 0);
  const prevStart = new Date(y, m-1, 1);
  const prevEnd = new Date(y, m, 0);

  const cur = weekStats(start, end);
  const prev = weekStats(prevStart, prevEnd);

  const pmc = computePMC();
  const ctlStart = pmc ? valueOnDate(pmc.series, fmt(new Date(start.getTime() - DAY_MS)), 'ctl') : null;
  const ctlEnd = pmc ? valueOnDate(pmc.series, fmt(end), 'ctl') : null;
  const ftpStart = ftpOnDate(fmt(new Date(start.getTime() - DAY_MS)));
  const ftpEnd = ftpOnDate(fmt(end));

  return {
    label:`${MONTHS_ES[m]} ${y}`, prevLabel:`${MONTHS_ES[(m+11)%12]} ${m===0?y-1:y}`,
    isCurrent, start, end,
    cur, prev,
    ctlDelta:(ctlStart!==null && ctlEnd!==null) ? +(ctlEnd-ctlStart).toFixed(1) : null,
    ftpDelta:(ftpStart && ftpEnd) ? ftpEnd-ftpStart : null,
    daysElapsed:Math.round((end-start)/DAY_MS)+1,
    daysInMonth:new Date(y, m+1, 0).getDate(),
  };
}

/* Un par de frases, no un párrafo: lo que más cambió y qué hacer con eso */
function monthlyRecommendation(mp){
  if (mp.cur.count === 0){
    return mp.prev.count > 0
      ? 'Todavía no registras salidas este mes. Retómalo con algo suave: lo que rompe el progreso no es un mes flojo, es dejarlo ir dos meses seguidos.'
      : 'Sin salidas registradas todavía. En cuanto sincronices Strava, aquí vas a ver mes contra mes cómo se mueve tu condición.';
  }
  const kmPct = mp.prev.km > 0 ? Math.round((mp.cur.km - mp.prev.km) / mp.prev.km * 100) : null;
  if (mp.ftpDelta && mp.ftpDelta >= 5)
    return `Tu FTP subió ${mp.ftpDelta} W este mes. Eso sí es condición nueva, no casualidad: sostén el volumen y en unas semanas lo notas también en las rodadas de grupo.`;
  if (mp.ctlDelta !== null && mp.ctlDelta >= 4)
    return `Tu fondo (CTL) subió ${mp.ctlDelta} puntos este mes. Es el ritmo correcto para ir subiendo de nivel sin quemarte.`;
  if (mp.ctlDelta !== null && mp.ctlDelta <= -3)
    return 'Tu fondo bajó este mes. No pasa nada si fue descanso planeado; si fue por falta de tiempo, con 2-3 salidas suaves por semana ya se detiene la caída.';
  if (kmPct !== null && kmPct >= 15)
    return `Rodaste ${kmPct}% más que el mes pasado. Para que se note en el grupo, el kilometraje ayuda menos que la constancia: lo que más pesa es no faltar a las salidas de la semana.`;
  if (kmPct !== null && kmPct <= -15)
    return `Rodaste ${Math.abs(kmPct)}% menos que el mes pasado. Si fue por agenda, aunque sean salidas cortas, sostener la frecuencia importa más que el volumen de cada una.`;
  return 'Vas parejo con el mes pasado. Para seguir subiendo, el siguiente paso normalmente es un poco más de volumen o una sesión más de calidad por semana, no ambas a la vez.';
}

/* Días de la semana asignados según cuántos días entrenas (0 = lunes) */
function weekDayOffsets(n){
  return ({
    3:[1,3,6], 4:[1,3,5,6], 5:[1,2,3,5,6], 6:[0,1,2,3,5,6], 7:[0,1,2,3,4,5,6],
  })[clamp(n,3,7)] || [1,3,5,6];
}

/* La fase no cuenta días hacia un evento: la decide tu fitness real (CTL).
   Así el plan se adapta solo conforme mejoras, sin fecha límite. Los cortes
   son los típicos de la periodización por bloques (Coggan/Friel): primero
   se construye el motor aeróbico, la intensidad se añade después y en dosis
   creciente. */
function phaseForCtl(ctl){
  if (ctl < 18) return 'Fundamento';
  if (ctl < 32) return 'Base';
  if (ctl < 48) return 'Desarrollo';
  if (ctl < 65) return 'Progresión';
  return 'Rendimiento';
}
const PHASE_NOTE = {
  Fundamento:'Sin nada de intensidad todavía: el objetivo es que el cuerpo se acostumbre a pedalear seguido. La condición sube sola con estas salidas suaves antes de meter cualquier esfuerzo fuerte.',
  Base:'Ya aguantas volumen; se agrega un poco de tempo para empezar a subir el techo, sin tocar el umbral todavía.',
  Desarrollo:'Entra el sweet spot y la fuerza-resistencia: la dosis de intensidad que más sube el FTP con el menor desgaste.',
  'Progresión':'Trabajo de umbral en serio. Aquí es donde se nota el salto de nivel frente a rodadas de grupo exigentes.',
  'Rendimiento':'Tu fondo ya es alto: se agrega VO₂ máx para el techo de potencia y se sostiene el umbral con más volumen.',
};

function weekTemplate(phase, daysPerWeek, isRecovery){
  if (isRecovery){
    const base = ['rec','z2','z2'];
    if (daysPerWeek >= 4) base.push('rec');
    if (daysPerWeek >= 5) base.push('z2');
    if (daysPerWeek >= 6) base.push('rec');
    return base.slice(0, daysPerWeek);
  }
  let list;
  if (phase === 'Fundamento')       list = ['z2','rec','z2','z2long','rec','z2'];   // nada de intensidad aún
  else if (phase === 'Base')        list = ['z2','tempo','z2','z2long','rec','z2'];
  else if (phase === 'Desarrollo')  list = ['z2','ss','fuerza','z2long','rec','z2'];
  else if (phase === 'Progresión')  list = ['z2','umbral','ss','z2long','rec','z2'];
  else                               list = ['z2','umbral','vo2','z2long','rec','z2']; // Rendimiento
  const order = [3,1,2,0,5,4];   // prioridad: larga, calidad 1, calidad 2, suave…
  const chosen = order.slice(0, daysPerWeek).sort((a,b)=>a-b).map(i => list[i]);
  return chosen;
}

/* ------------------------------------------------------------
   PLAN CONTINUO (sin fecha de evento)
   Mesociclo de 4 semanas: 3 de carga creciente + 1 de descarga,
   repitiendo mientras entrenes. La fase (qué tipo de sesión toca)
   la decide tu CTL actual, no un conteo de semanas hacia una meta.
   La ventana visible es una porción móvil (no todo el historial),
   para que el plan no crezca sin límite con los meses.
------------------------------------------------------------ */
function buildPlan(){
  const cfg = S.planCfg;
  const configuredStart = mondayOf(parseDate(cfg.startDate || fmt(today)));
  const windowStart = mondayOf(new Date(today.getFullYear(), today.getMonth()-5, 1));
  const start = configuredStart > windowStart ? configuredStart : windowStart;
  const horizonEnd = new Date(today.getFullYear(), today.getMonth()+2, 0);   // fin del mes siguiente
  const nWeeks = clamp(Math.ceil((horizonEnd - start)/(7*DAY_MS)), 4, 40);

  const pmc = computePMC();
  const ctl = pmc ? pmc.ctl : 0;
  const phase = phaseForCtl(ctl);
  const baseTss = cfg.baseWeeklyTss || Math.max(140, Math.round(ctl * 7 * 1.05));
  const capTss = Math.round((cfg.weeklyHoursMax || 10) * 62);   // ~62 TSS por hora a ritmo de fondo

  const days = weekDayOffsets(cfg.daysPerWeek);
  const weeks = [];
  let target = baseTss;

  for (let i=0; i<nWeeks; i++){
    const wStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i*7);
    const wEnd = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + 6);
    const isRecovery = (i % 4) === 3;

    if (i > 0){
      if (isRecovery) target = Math.round(target * 0.65);
      else target = Math.round(Math.min(capTss, target * (weeks[i-1] && weeks[i-1].recovery ? 1.15 : 1.06)));
    }
    target = clamp(target, 90, capTss);

    const tmpl = weekTemplate(phase, clamp(cfg.daysPerWeek,3,7), isRecovery);
    const weights = tmpl.map(k => SESSIONS[k].zone === 2 && k === 'z2long' ? 2.2 : SESSIONS[k].zone <= 1 ? 0.5 : 1);
    const wSum = weights.reduce((a,b)=>a+b,0);

    const sessions = tmpl.map((k, idx) => {
      const s = SESSIONS[k];
      const share = target * (weights[idx]/wSum);
      const hours = s.inten > 0 ? share / (s.inten*s.inten*100) : 0;
      const minutes = clamp(Math.round(hours*60/5)*5, s.min, s.max);
      const realTss = Math.round((minutes/60) * s.inten * s.inten * 100);
      const d = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + days[idx]);
      return { key:k, name:s.name, zone:s.zone, minutes, tss:realTss, date:fmt(d), dateObj:d, idx:idx+1 };
    });

    weeks.push({
      week:i+1, start:wStart, end:wEnd, phase, recovery:isRecovery,
      targetTss:sessions.reduce((t,s)=>t+s.tss,0),
      sessions,
    });
  }
  return weeks;
}

let PLAN = [];
function rebuildPlan(){ PLAN = buildPlan(); }

function currentWeekIndex(){
  if (!PLAN.length) return 0;
  const idx = PLAN.findIndex(w => today >= w.start && today <= w.end);
  if (idx >= 0) return idx;
  return today < PLAN[0].start ? 0 : PLAN.length-1;
}

/* Marca automáticamente la sesión del plan que cae en la fecha de la salida */
function autoMarkSession(dateObj){
  if (!PLAN.length) return;
  const w = PLAN.find(w => dateObj >= w.start && dateObj <= w.end);
  if (!w) return;
  const dateStr = fmt(dateObj);
  const exact = w.sessions.find(s => s.date === dateStr && s.key !== 'descanso');
  if (exact){ S.sessionsDone[`${w.week}-${exact.idx}`] = true; return; }
  const pending = w.sessions.find(s => s.key !== 'descanso' && !S.sessionsDone[`${w.week}-${s.idx}`]);
  if (pending) S.sessionsDone[`${w.week}-${pending.idx}`] = true;
}

function planCompliance(){
  let expected = 0, done = 0;
  PLAN.forEach(w => w.sessions.forEach(s => {
    if (s.key === 'descanso') return;
    if (s.dateObj <= today){ expected++; if (S.sessionsDone[`${w.week}-${s.idx}`]) done++; }
  }));
  return { expected, done, pct:expected ? Math.round(done/expected*100) : null };
}

/* ---------- Mantenimiento ---------- */
function componentKm(c){
  return ridesArray()
    .filter(a => a.date >= c.startDate)
    .reduce((t,a) => t + (a.distanceKm||0), 0);
}

/* ============================================================
   LECTURAS AUTOMÁTICAS
   Cada aviso explica qué se midió, qué significa y qué hacer.
============================================================ */
function buildInsights(){
  const out = [];
  const push = (level, title, text) => out.push({ level, title, text });
  const pmc = computePMC();
  const ftp = S.profile.ftp;

  if (!ftp){
    const est = estimateFtp();
    push('warn', 'Falta tu FTP',
      est ? `Sin FTP no hay zonas ni carga por potencia. Con tus datos, una estimación razonable es ${est.ftp} W (${est.why}).`
          : 'Sin FTP no se pueden calcular zonas ni carga. Ponlo en Ajustes, o haz una prueba de 20 min y multiplica por 0.95.');
  } else if (S.profile.ftpDate){
    const age = Math.round((today - parseDate(S.profile.ftpDate))/DAY_MS);
    if (age > 56) push('warn', 'Tu FTP tiene ' + age + ' días',
      'La forma cambia cada 4–8 semanas. Un FTP viejo desvía las zonas, el TSS y toda la carga. Repite la prueba de 20 min.');
    const est = estimateFtp();
    if (est && est.ftp >= ftp + 8)
      push('good', 'Parece que subiste de nivel',
        `Tus datos recientes apuntan a un FTP de ${est.ftp} W (${est.why}), ${est.ftp-ftp} W arriba del que tienes guardado.`);
  }

  if (pmc){
    if (pmc.rampRate > 8)
      push('bad', 'Estás subiendo la carga muy rápido',
        `Tu CTL creció ${pmc.rampRate} puntos en 7 días. Arriba de 8 por semana el riesgo de lesión y de enfermarte se dispara. Baja a 3–6.`);
    else if (pmc.rampRate < -5)
      push('warn', 'Vas perdiendo fondo',
        `Tu CTL bajó ${Math.abs(pmc.rampRate)} puntos esta semana. Si no es una descarga planeada, retoma volumen suave.`);
    else if (pmc.rampRate >= 3)
      push('good', 'Progresión en buen rango',
        `Tu CTL sube ${pmc.rampRate} puntos por semana: es el ritmo en el que se gana fondo sin romperse.`);

    if (pmc.tsb < -30)
      push('bad', 'Fatiga acumulada alta',
        `Tu frescura (TSB) está en ${pmc.tsb}. Dos o tres días fáciles la devuelven a rango sin perder lo ganado.`);
    if (pmc.tsb > 25 && pmc.ctl > 20)
      push('warn', 'Llevas mucho tiempo fresco',
        `TSB en +${pmc.tsb}: descansado, pero el fondo empieza a bajar si no vuelves a cargar.`);
  }

  const pol = polarization();
  if (pol){
    if (pol.midPct > 35)
      push('warn', 'Demasiado tiempo en la zona gris',
        `${pol.midPct}% de tus últimas 8 semanas fue en tempo (Z3). Cansa casi como el umbral pero estimula menos. Lo suave más suave y lo fuerte más fuerte.`);
    else if (pol.lowPct >= 75 && pol.highPct >= 10)
      push('good', 'Buen reparto de intensidad',
        `${pol.lowPct}% fácil y ${pol.highPct}% fuerte: cerca del reparto 80/20 que mejor resultado da en la literatura.`);
    if (pol.highPct > 30)
      push('warn', 'Mucha intensidad',
        `${pol.highPct}% del tiempo por encima del umbral. Sostenido, eso lleva a estancarte. Añade fondo Z2.`);
  }

  const dec = decouplingSeries();
  if (dec.length){
    const last = dec[dec.length-1];
    if (last.value > 8)
      push('warn', 'Se te cae el rendimiento en la segunda mitad',
        `En "${last.name}" tu relación potencia/pulso cayó ${last.value}%. Arriba de 5% suele ser base aeróbica corta, calor o falta de comida en ruta.`);
    else if (last.value <= 5)
      push('good', 'Aguantas bien la distancia',
        `Desacople de ${last.value}% en tu última salida larga: por debajo de 5% indica base aeróbica sólida.`);
  }

  const comp = planCompliance();
  if (comp.pct !== null && comp.expected >= 6){
    if (comp.pct < 60) push('warn', 'Vas dejando sesiones sin hacer',
      `Cumpliste ${comp.done} de ${comp.expected} sesiones (${comp.pct}%). El plan asume continuidad; si el problema es tiempo, baja los días por semana en Ajustes.`);
    else if (comp.pct >= 90) push('good', 'Cumplimiento del plan al ' + comp.pct + '%', 'Constancia es lo que más pesa a mediano plazo. Vas bien.');
  }

  S.components.forEach(c => {
    const km = componentKm(c);
    if (km >= c.thresholdKm) push('bad', `${c.name}: toca cambiar`,
      `Llevas ${Math.round(km)} km, por encima de los ${c.thresholdKm} km recomendados.`);
    else if (km >= c.thresholdKm*0.9) push('warn', `${c.name} cerca del límite`,
      `${Math.round(km)} de ${c.thresholdKm} km. Ve consiguiendo el repuesto.`);
  });

  const q = loadQuality();
  if (q === 'estimada' && loadRides().length >= 3)
    push('warn', 'Tu carga es una estimación',
      'Sin potenciómetro ni pulso, el TSS se calcula solo por duración. Registrar pulso ya mejora mucho la precisión.');

  const order = { bad:0, warn:1, good:2 };
  return out.sort((a,b) => order[a.level] - order[b.level]);
}

/* ============================================================

   Ya no cuenta semanas hacia un evento: se navega mes a mes, como
   el calendario de Salidas, y arriba se compara el mes con el
